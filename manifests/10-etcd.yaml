---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: etcd-selfsigned
  namespace: teleport
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: etcd-ca
  namespace: teleport
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  secretName: etcd-ca
  isCA: true
  commonName: etcd-ca
  duration: 87600h
  renewBeforePercentage: 20
  privateKey:
    algorithm: RSA
    size: 4096
    # Keep the CA key stable across routine certificate renewal so existing
    # etcd leaf certificates remain verifiable. CA key rotation requires a
    # separately planned overlapping-trust migration.
    rotationPolicy: Never
  issuerRef:
    name: etcd-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: etcd-ca
  namespace: teleport
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  ca:
    secretName: etcd-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: etcd-server-tls
  namespace: teleport
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  secretName: etcd-server-tls
  duration: 2160h
  renewBeforePercentage: 50
  commonName: etcd-0.etcd.teleport.svc.cluster.local
  dnsNames:
    - etcd-0.etcd.teleport.svc.cluster.local
    - etcd.teleport.svc
    - etcd.teleport.svc.cluster.local
    - localhost
  ipAddresses:
    - 127.0.0.1
  usages:
    - server auth
    - client auth
    - digital signature
    - key encipherment
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  issuerRef:
    name: etcd-ca
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: etcd-client-tls
  namespace: teleport
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  secretName: etcd-client-tls
  duration: 2160h
  renewBeforePercentage: 50
  commonName: teleport
  usages:
    - client auth
    - digital signature
    - key encipherment
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  issuerRef:
    name: etcd-ca
    kind: Issuer
---
# ============================
# etcd headless Service
# ============================
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: teleport
  labels:
    app: etcd
spec:
  clusterIP: None
  selector:
    app: etcd
  ports:
    - name: client
      port: 2379
      targetPort: 2379
    - name: peer
      port: 2380
      targetPort: 2380
---
# ============================
# etcd StatefulSet (single node, TLS)
# ============================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: teleport
  labels:
    platform.suncoast.systems/vpa-exclude: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  serviceName: etcd
  replicas: 1
  updateStrategy:
    # The single etcd member is restarted manually during the initial
    # certificate migration. Routine TLS renewals are reloaded by etcd on new
    # connections and must not create an automatic Teleport outage.
    type: OnDelete
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      volumes:
        - name: etcd-tls
          projected:
            sources:
              - secret:
                  name: etcd-server-tls
                  items:
                    - key: tls.crt
                      path: server.crt
                    - key: tls.key
                      path: server.key
              # During the one-time CA migration, etcd must trust both the
              # legacy Teleport client certificate and the new cert-manager
              # client certificate. The transition ConfigMap is removed once
              # Teleport has rolled onto the new client certificate.
              - configMap:
                  name: etcd-ca-transition
                  items:
                    - key: ca.crt
                      path: ca.crt
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.14
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/etcd"]
          args:
            - --name=$(POD_NAME)
            - --data-dir=/etcd-data
            # Client TLS
            - --listen-client-urls=https://0.0.0.0:2379
            - --advertise-client-urls=https://$(POD_NAME).etcd.teleport.svc.cluster.local:2379
            - --trusted-ca-file=/etc/etcd/pki/ca.crt
            - --cert-file=/etc/etcd/pki/server.crt
            - --key-file=/etc/etcd/pki/server.key
            # Peer TLS
            - --listen-peer-urls=https://0.0.0.0:2380
            - --initial-advertise-peer-urls=https://$(POD_NAME).etcd.teleport.svc.cluster.local:2380
            - --peer-trusted-ca-file=/etc/etcd/pki/ca.crt
            - --peer-cert-file=/etc/etcd/pki/server.crt
            - --peer-key-file=/etc/etcd/pki/server.key
            - --initial-cluster=etcd-0=https://etcd-0.etcd.teleport.svc.cluster.local:2380
            - --initial-cluster-state=new
            - --initial-cluster-token=etcd-cluster-1
            - --auto-compaction-mode=periodic
            - --auto-compaction-retention=1h
            - --quota-backend-bytes=8589934592
            - --logger=zap
            - --log-level=info
            - --client-cert-auth=false
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 2379
              name: client
            - containerPort: 2380
              name: peer
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          readinessProbe:
            tcpSocket: { port: 2379 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 2379 }
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: etcd-data
              mountPath: /etcd-data
            - name: etcd-tls
              mountPath: /etc/etcd/pki
              readOnly: true
  volumeClaimTemplates:
    - metadata:
        name: etcd-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
