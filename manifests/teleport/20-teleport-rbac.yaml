---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: teleport-sa
  namespace: teleport
---
# Impersonation for K8s access via Teleport
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: teleport-kube-impersonator
rules:
  - apiGroups: [""]
    resources: ["users","groups","serviceaccounts"]
    verbs: ["impersonate"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["userextras/*"]
    verbs: ["impersonate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: teleport-kube-impersonator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: teleport-kube-impersonator
subjects:
  - kind: ServiceAccount
    name: teleport-sa
    namespace: teleport
---
# Service discovery for auto-registration of annotated services
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: teleport-service-discovery
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: teleport-service-discovery-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: teleport-service-discovery
subjects:
  - kind: ServiceAccount
    name: teleport-sa
    namespace: teleport
---
# Kubernetes service RBAC (required for in-cluster kube service health checks)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: teleport-kube-service
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: teleport-kube-service-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: teleport-kube-service
subjects:
  - kind: ServiceAccount
    name: teleport-sa
    namespace: teleport
---
# ============================
# Watchdog RBAC (allow pod self-delete for auto-restart)
# ============================
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: teleport-self-kill
  namespace: teleport
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get","delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: teleport-self-kill-binding
  namespace: teleport
subjects:
  - kind: ServiceAccount
    name: teleport-sa
    namespace: teleport
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: teleport-self-kill
