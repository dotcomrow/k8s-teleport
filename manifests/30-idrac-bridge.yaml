---
# ============================
# Legacy iDRAC TLS bridge (Nginx)
# Allows Teleport to talk HTTP in-cluster while Nginx speaks TLS1.0 to iDRAC and rewrites absolute URLs
# ============================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: idrac-bridge
  namespace: teleport
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: idrac-bridge-haproxy
  namespace: teleport
data:
  nginx.conf: |
    worker_processes  auto;
    events { worker_connections  4096; }
    http {
      log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'cache=$upstream_cache_status rt=$request_time '
                      'uct=$upstream_connect_time uht=$upstream_header_time '
                      'urt=$upstream_response_time';
      access_log /dev/stdout main;
      error_log  /dev/stderr notice;
      # Allow large OAuth2 cookies/headers from shared domains.
      client_header_buffer_size 16k;
      large_client_header_buffers 8 64k;
      # The iDRAC6 controller is extremely slow and handles parallel requests poorly.
      # Cache every cacheable GET/HEAD response. Static objects use a cache key that
      # intentionally ignores cache-busting query strings used by the legacy UI.
      proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=idrac_cache:64m
                       max_size=2g inactive=3650d use_temp_path=off;
      # Never share pre-login responses that establish an iDRAC session. Once a
      # browser has cookies, the full Cookie header is part of the page cache key.
      map $http_cookie $idrac_cache_no_session {
        ""      1;
        default 0;
      }
      proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
      proxy_next_upstream_timeout 90s;

      upstream idrac_upstream {
        server 10.0.2.10:443;
        keepalive 16;
      }

      server {
        listen 8080;

        # Talk to legacy iDRAC over TLS1.0 and ignore its cert.
        resolver 1.1.1.1 valid=300s ipv6=off;
        proxy_pass_request_headers on;
        proxy_ssl_server_name off;
        proxy_ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        proxy_ssl_ciphers ALL:@SECLEVEL=0;
        proxy_ssl_verify off;
        proxy_ssl_session_reuse on;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host 10.0.2.10;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Encoding "";

        # Rewrite absolute redirects, cookies, and response-body URLs to stay on Teleport.
        proxy_redirect https://10.0.2.10/ https://idrac.teleport.app.suncoast.systems/;
        proxy_redirect https://10.0.2.10:443/ https://idrac.teleport.app.suncoast.systems/;
        proxy_cookie_domain 10.0.2.10 idrac.teleport.app.suncoast.systems;
        sub_filter_once off;
        sub_filter_types text/css application/javascript text/javascript application/x-javascript application/json application/xml text/xml application/x-java-jnlp-file;
        sub_filter "https://10.0.2.10:443" "https://idrac.teleport.app.suncoast.systems";
        sub_filter "http://10.0.2.10:443" "https://idrac.teleport.app.suncoast.systems";
        sub_filter "https://10.0.2.10" "https://idrac.teleport.app.suncoast.systems";
        sub_filter "http://10.0.2.10" "https://idrac.teleport.app.suncoast.systems";
        sub_filter "ip=10.0.2.10" "ip=idrac.teleport.app.suncoast.systems";

        # Whole-site authenticated GET/HEAD cache. Cookie-bearing pages, HTML frames,
        # XML navigation, and generated JavaScript are isolated per session. Static
        # assets below are shared across sessions. Pre-login requests bypass this cache
        # so a session-establishing Set-Cookie is never shared.
        proxy_cache idrac_cache;
        proxy_cache_key "idrac-v2|page|$request_uri|$http_cookie";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 206 301 302 3650d;
        proxy_cache_valid 404 30s;
        proxy_cache_valid any 15s;
        proxy_cache_min_uses 1;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_lock_age 30s;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
        proxy_cache_bypass $idrac_cache_no_session;
        proxy_no_cache $idrac_cache_no_session;
        # iDRAC marks nearly every response no-cache and may refresh its cookie on
        # authenticated GETs. Those responses remain isolated by the cookie cache key.
        proxy_ignore_headers Cache-Control Expires X-Accel-Expires Set-Cookie;
        add_header X-IDRAC-Cache $upstream_cache_status always;

        proxy_buffering on;
        proxy_buffers 32 64k;
        proxy_busy_buffers_size 256k;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 15s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Force simple filename for JNLP downloads (handles extra path suffix like viewer.jnlp(...)).
        location ~* \.jnlp.* {
          add_header Content-Disposition 'attachment; filename="idrac.jnlp"' always;
          add_header Content-Type application/x-java-jnlp-file always;
          proxy_hide_header Content-Disposition;
          proxy_hide_header Content-Type;
          proxy_hide_header Cache-Control;
          proxy_hide_header Expires;
          add_header Cache-Control "no-store" always;
          proxy_cache off;
          proxy_pass https://idrac_upstream;
          sub_filter_types application/x-java-jnlp-file application/xml text/xml text/plain;
        }

        # iDRAC's XMLHttpRequest data loader uses POST requests under /data. Keep the
        # namespace explicitly uncacheable even if a firmware endpoint later uses GET.
        location = /data {
          proxy_cache off;
          add_header X-IDRAC-Cache BYPASS always;
          proxy_pass https://idrac_upstream;
        }

        location ^~ /data/ {
          proxy_cache off;
          add_header X-IDRAC-Cache BYPASS always;
          proxy_pass https://idrac_upstream;
        }

        # Static resources are shared across sessions and cached very aggressively.
        # The v2 cache-key prefix prevents reuse of files left by the retired cache.
        location ~* \.(?:css|js|png|jpe?g|gif|ico|svg|ttf|woff2?|map|jar)$ {
          proxy_cache_key "idrac-v2|static|$uri";
          proxy_cache_valid 200 206 301 302 3650d;
          proxy_cache_valid 404 1d;
          proxy_cache_bypass 0;
          proxy_no_cache 0;
          proxy_ignore_headers Cache-Control Expires X-Accel-Expires Set-Cookie;
          proxy_hide_header Cache-Control;
          proxy_hide_header Expires;
          proxy_hide_header Set-Cookie;
          add_header X-IDRAC-Cache $upstream_cache_status always;
          add_header Cache-Control "public, max-age=315360000, immutable" always;
          add_header Expires "Thu, 31 Dec 2037 23:55:55 GMT" always;
          proxy_pass https://idrac_upstream;
        }

        # Permanently cache all other GET/HEAD requests, including HTML/XML/JS-generated
        # resources. Non-GET/HEAD methods are never cached; authenticated responses are
        # keyed by the full Cookie header.
        location / {
          proxy_pass https://idrac_upstream;
        }
      }
    }
  stunnel.conf: |
    pid = /var/run/stunnel.pid
    foreground = yes
    debug = 4
    output = /dev/stdout
    client = yes
    verify = 0
    # Allow TLS1.x/1.2 while still permitting SSLv3 for the legacy target
    sslVersion = all
    options = -NO_SSLv3
    ciphers = ALL
    TIMEOUTconnect = 10

    [kvm]
    accept = 0.0.0.0:5900
    connect = 10.0.2.10:5900
  openssl.cnf: |
    # Minimal config for legacy TLS1.0/weak ciphers on old OpenSSL
    [system_default_sect]
    MinProtocol = SSLv3
    CipherString = ALL
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: idrac-cache-nfs
  namespace: teleport
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idrac-bridge
  namespace: teleport
  labels:
    app: idrac-bridge
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: idrac-bridge
  template:
    metadata:
      labels:
        app: idrac-bridge
    spec:
      serviceAccountName: idrac-bridge
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          args: ["nginx","-g","daemon off;","-c","/etc/nginx/nginx.conf"]
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-cache
              mountPath: /var/cache/nginx
        - name: kvm-proxy
          image: ghcr.io/dotcomrow/kvm-proxy:7a65641c8fe1f1d4c1b29ee2bf79453edf099b63
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # Generate a throwaway cert for the modern-facing listener
              mkdir -p /tmp/stunnel
              openssl req -new -x509 -nodes -subj "/CN=idrac-bridge" -days 3650 \
                -out /tmp/stunnel/cert.pem -keyout /tmp/stunnel/key.pem >/dev/null 2>&1

              # stunnel in a dual-hop: front terminates modern TLS, back re-encrypts to legacy SSLv3
              cat >/tmp/stunnel/stunnel.conf <<'CONF'
              pid = /var/run/stunnel.pid
              foreground = yes
              debug = 4
              output = /dev/stdout

              # Frontend: modern TLS for clients
              [front-kvm]
              accept = 0.0.0.0:5900
              connect = 127.0.0.1:15000
              cert = /tmp/stunnel/cert.pem
              key  = /tmp/stunnel/key.pem
              # Accept modern TLS from clients (allow TLS1.x)
              sslVersion = all
              options = NO_SSLv2
              # Allow legacy Java clients that only offer older ciphers.
              ciphers = ALL:!aNULL:!eNULL

              # Backend: client to iDRAC using legacy SSLv3/TLS1.0 as needed
              [back-kvm]
              client = yes
              accept = 127.0.0.1:15000
              connect = 10.0.2.10:5900
              # Allow TLS1.x or SSLv3 as the iDRAC supports
              sslVersion = all
              options = NO_SSLv2
              ciphers = ALL:!aNULL:!eNULL
              verify = 0
              TIMEOUTconnect = 10
              CONF

              echo "starting stunnel TLS bridge: client<->(TLS1.2)front -> (SSLv3)idrac"
              exec stunnel /tmp/stunnel/stunnel.conf
          ports:
            - containerPort: 5900
              name: kvm
        - name: diag
          image: alpine:3.8
          command: ["/bin/sh","-c","apk add --no-cache curl openssl busybox-extras && exec sleep 99999999"]
          env:
            - name: OPENSSL_CONF
              value: /etc/stunnel/openssl.cnf
          volumeMounts:
            - name: config
              mountPath: /etc/stunnel/openssl.cnf
              subPath: openssl.cnf
      volumes:
        - name: config
          configMap:
            name: idrac-bridge-haproxy
        - name: nginx-cache
          persistentVolumeClaim:
            claimName: idrac-cache-nfs
---
apiVersion: v1
kind: Service
metadata:
  name: idrac-bridge
  namespace: teleport
spec:
  selector:
    app: idrac-bridge
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: kvm
      port: 5900
      targetPort: kvm
---
# Optional external exposure for KVM TCP (5900) via NodePort/LB
apiVersion: v1
kind: Service
metadata:
  name: idrac-bridge-kvm
  namespace: teleport
spec:
  type: LoadBalancer   # change to NodePort if preferred
  loadBalancerIP: 10.0.0.150
  selector:
    app: idrac-bridge
  ports:
    - name: kvm
      port: 5900
      targetPort: kvm
