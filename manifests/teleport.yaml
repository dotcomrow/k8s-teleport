---
apiVersion: v1
kind: ConfigMap
metadata:
  name: teleport-config
data:
  teleport.yaml: |
    version: v3
    teleport:
      nodename: teleport
      data_dir: /var/lib/teleport
      log:
        output: stderr
        severity: INFO
      storage:
        type: etcd
        prefix: /teleport
        endpoints:
          - http://etcd-0.etcd.teleport.svc.cluster.local:2379
          - http://etcd-1.etcd.teleport.svc.cluster.local:2379
          - http://etcd-2.etcd.teleport.svc.cluster.local:2379
        peers:
          - http://etcd-0.etcd.teleport.svc.cluster.local:2379
          - http://etcd-1.etcd.teleport.svc.cluster.local:2379
          - http://etcd-2.etcd.teleport.svc.cluster.local:2379
        tls_ca_file: /etc/ssl/certs/ca-certificates.crt
        # Uncomment and configure the following for TLS
        # tls_key_file: /etc/teleport/etcd-client.key
        # tls_cert_file: /etc/teleport/etcd-client.crt
    auth_service:
      enabled: yes
      listen_addr: 0.0.0.0:3025
    ssh_service:
      enabled: yes
      listen_addr: 0.0.0.0:3023
    proxy_service:
      enabled: yes
      listen_addr: 0.0.0.0:3080
---
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: teleport
  labels:
    app: etcd
spec:
  clusterIP: None
  ports:
    - name: client
      port: 2379
      targetPort: 2379
    - name: peer
      port: 2380
      targetPort: 2380
  selector:
    app: etcd
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: teleport
spec:
  serviceName: etcd
  replicas: 1
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.14
          command:
            - /usr/local/bin/etcd
            - --name=$(POD_NAME)
            - --data-dir=/etcd-data
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://$(POD_NAME).etcd.teleport.svc.cluster.local:2379
            - --listen-peer-urls=http://0.0.0.0:2380
            - --initial-advertise-peer-urls=http://$(POD_NAME).etcd.teleport.svc.cluster.local:2380
            - --initial-cluster=etcd-0=http://etcd-0.etcd.teleport.svc.cluster.local:2380,etcd-1=http://etcd-1.etcd.teleport.svc.cluster.local:2380,etcd-2=http://etcd-2.etcd.teleport.svc.cluster.local:2380
            - --initial-cluster-state=new
            - --initial-cluster-token=etcd-cluster-1
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 2379
              name: client
            - containerPort: 2380
              name: peer
          volumeMounts:
            - name: etcd-data
              mountPath: /etcd-data
  volumeClaimTemplates:
    - metadata:
        name: etcd-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi