---
# ============================
# Namespace (Linkerd off)
# ============================
apiVersion: v1
kind: Namespace
metadata:
  name: teleport
  labels:
    app: teleport
  annotations:
    linkerd.io/inject: disabled
---
# ============================
# PreSync: generate etcd TLS (CA + server cert)
#   - writes Secret: etcd-tls  (ca.crt, server.crt, server.key)
# ============================
apiVersion: batch/v1
kind: Job
metadata:
  name: etcd-tls-bootstrap
  namespace: teleport
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      volumes:
        - name: work
          emptyDir: {}
      containers:
        - name: openssl
          image: alpine:3.19
          volumeMounts:
            - name: work
              mountPath: /work
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              apk add --no-cache openssl
              # 1) CA
              openssl genrsa -out /work/ca.key 4096
              openssl req -x509 -new -nodes -key /work/ca.key -sha256 -days 3650 \
                -subj "/CN=etcd-ca" -out /work/ca.crt
              # 2) Server cert with SANs
              cat >/work/req.cnf <<'CNF'
              [req]
              distinguished_name=req
              req_extensions=v3_req
              prompt=no
              [v3_req]
              keyUsage = critical, digitalSignature, keyEncipherment
              extendedKeyUsage = serverAuth
              subjectAltName = @alt_names
              [alt_names]
              DNS.1 = etcd-0.etcd.teleport.svc.cluster.local
              DNS.2 = etcd.teleport.svc
              DNS.3 = etcd.teleport.svc.cluster.local
              DNS.4 = localhost
              IP.1  = 127.0.0.1
              CNF
              openssl genrsa -out /work/server.key 2048
              openssl req -new -key /work/server.key \
                -subj "/CN=etcd-0.etcd.teleport.svc.cluster.local" \
                -out /work/server.csr -config /work/req.cnf
              openssl x509 -req -in /work/server.csr -CA /work/ca.crt -CAkey /work/ca.key \
                -CAcreateserial -out /work/server.crt -days 3650 -sha256 \
                -extensions v3_req -extfile /work/req.cnf
              # Let the next container read the files
              chmod 0644 /work/ca.crt /work/server.crt
              chmod 0640 /work/server.key
              # Signal readiness
              touch /work/ready
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
        - name: kubectl
          image: bitnami/kubectl:1.29
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: work
              mountPath: /work
          command: ["/bin/sh","-c"]
          args:
            - |
              while [ ! -f /work/ready ]; do sleep 1; done
              kubectl -n teleport create secret generic etcd-tls \
                --from-file=ca.crt=/work/ca.crt \
                --from-file=server.crt=/work/server.crt \
                --from-file=server.key=/work/server.key \
                --dry-run=client -o yaml | kubectl apply -f -
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
# ============================
# etcd headless Service
# ============================
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: teleport
  labels:
    app: etcd
spec:
  clusterIP: None
  selector:
    app: etcd
  ports:
    - name: client
      port: 2379
      targetPort: 2379
    - name: peer
      port: 2380
      targetPort: 2380
---
# ============================
# etcd StatefulSet (single node, TLS)
# ============================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: teleport
spec:
  serviceName: etcd
  replicas: 1
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      volumes:
        - name: etcd-tls
          secret:
            secretName: etcd-tls
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.14
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/etcd"]
          args:
            - --name=$(POD_NAME)
            - --data-dir=/etcd-data
            # Client TLS
            - --listen-client-urls=https://0.0.0.0:2379
            - --advertise-client-urls=https://$(POD_NAME).etcd.teleport.svc.cluster.local:2379
            - --trusted-ca-file=/etc/etcd/pki/ca.crt
            - --cert-file=/etc/etcd/pki/server.crt
            - --key-file=/etc/etcd/pki/server.key
            # Peer TLS (single node but keep consistent)
            - --listen-peer-urls=https://0.0.0.0:2380
            - --initial-advertise-peer-urls=https://$(POD_NAME).etcd.teleport.svc.cluster.local:2380
            - --peer-trusted-ca-file=/etc/etcd/pki/ca.crt
            - --peer-cert-file=/etc/etcd/pki/server.crt
            - --peer-key-file=/etc/etcd/pki/server.key
            - --initial-cluster=etcd-0=https://etcd-0.etcd.teleport.svc.cluster.local:2380
            - --initial-cluster-state=new
            - --initial-cluster-token=etcd-cluster-1
            - --logger=zap
            - --log-level=info
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 2379
              name: client
            - containerPort: 2380
              name: peer
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 2379
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 2379
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: etcd-data
              mountPath: /etcd-data
            - name: etcd-tls
              mountPath: /etc/etcd/pki
              readOnly: true
  volumeClaimTemplates:
    - metadata:
        name: etcd-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
# ============================
# Teleport config (ConfigMap)
# ============================
apiVersion: v1
kind: ConfigMap
metadata:
  name: teleport-config
  namespace: teleport
data:
  teleport.yaml: |
    version: v3
    teleport:
      data_dir: /var/lib/teleport
      log:
        output: stderr
        severity: INFO
      storage:
        type: etcd
        peers:
          - https://etcd-0.etcd.teleport.svc.cluster.local:2379
        prefix: /teleport/
        tls_ca_file: /etc/teleport/etcd/ca.crt

    auth_service:
      enabled: true
      listen_addr: 0.0.0.0:3025

    proxy_service:
      enabled: true
      web_listen_addr: 0.0.0.0:3080
      # public_addr: teleport.app.suncoast.systems:443

    ssh_service:
      enabled: false
---
# ============================
# Teleport Deployment
# ============================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teleport
  namespace: teleport
  labels:
    app: teleport
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teleport
  template:
    metadata:
      labels:
        app: teleport
    spec:
      initContainers:
        - name: wait-for-etcd
          image: busybox:1.36
          command: ["/bin/sh","-c"]
          args: |
            set -e
            host="etcd-0.etcd.teleport.svc.cluster.local"
            echo "Waiting for DNS: $host"
            until nslookup "$host" >/dev/null 2>&1; do sleep 2; done
            echo "Waiting for TCP 2379 on $host"
            until nc -z "$host" 2379 >/dev/null 2>&1; do sleep 2; done
            echo "etcd is up"
      volumes:
        - name: teleport-config
          configMap:
            name: teleport-config
        - name: teleport-data
          emptyDir: {}
        - name: etcd-ca
          secret:
            secretName: etcd-tls
      containers:
        - name: teleport
          image: public.ecr.aws/gravitational/teleport-distroless:18.1.4
          imagePullPolicy: IfNotPresent
          command: ["teleport", "start", "-c", "/etc/teleport/teleport.yaml"]
          ports:
            - name: auth
              containerPort: 3025
            - name: web
              containerPort: 3080
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: teleport-config
              mountPath: /etc/teleport
              readOnly: true
            - name: teleport-data
              mountPath: /var/lib/teleport
            - name: etcd-ca
              mountPath: /etc/teleport/etcd/ca.crt
              subPath: ca.crt
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 3080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3080
            initialDelaySeconds: 20
            periodSeconds: 10
---
# ============================
# Teleport Service (ClusterIP)
# ============================
apiVersion: v1
kind: Service
metadata:
  name: teleport
  namespace: teleport
spec:
  selector:
    app: teleport
  ports:
    - name: web
      port: 3080
      targetPort: 3080
    - name: auth
      port: 3025
      targetPort: 3025
  type: ClusterIP
---
# ============================
# APISIX route → Teleport over HTTPS
# ============================
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: teleport-route
  namespace: teleport
  annotations:
    apisix.apache.org/timeout: "900"
    apisix.apache.org/websocket: "true"
spec:
  ingressClassName: apisix
  http:
    - name: webui
      websocket: true
      match:
        hosts:
          - teleport.app.suncoast.systems
        paths:
          - /*
      backends:
        - serviceName: teleport
          servicePort: 3080
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            scheme: https
        - name: client-control
          enable: true
          config:
            ssl_verify: false
