---
# ============================
# Namespace (Linkerd off)
# ============================
apiVersion: v1
kind: Namespace
metadata:
  name: teleport
  labels:
    app: teleport
  annotations:
    linkerd.io/inject: disabled
---
# ============================
# etcd headless Service
# ============================
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: teleport
  labels:
    app: etcd
spec:
  clusterIP: None
  selector:
    app: etcd
  ports:
    - name: client
      port: 2379
      targetPort: 2379
    - name: peer
      port: 2380
      targetPort: 2380
---
# ============================
# etcd StatefulSet (single node)
# ============================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: teleport
spec:
  serviceName: etcd
  replicas: 1
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.14
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/etcd
          args:
            - --name=$(POD_NAME)
            - --data-dir=/etcd-data
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://$(POD_NAME).etcd.teleport.svc.cluster.local:2379
            - --listen-peer-urls=http://0.0.0.0:2380
            - --initial-advertise-peer-urls=http://$(POD_NAME).etcd.teleport.svc.cluster.local:2380
            - --initial-cluster=etcd-0=http://etcd-0.etcd.teleport.svc.cluster.local:2380
            - --initial-cluster-state=new
            - --initial-cluster-token=etcd-cluster-1
            - --logger=zap
            - --log-level=info
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 2379
              name: client
            - containerPort: 2380
              name: peer
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 2379
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 2379
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: etcd-data
              mountPath: /etcd-data
  volumeClaimTemplates:
    - metadata:
        name: etcd-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
# ============================
# Teleport config (ConfigMap)
# ============================
apiVersion: v1
kind: ConfigMap
metadata:
  name: teleport-config
  namespace: teleport
data:
  teleport.yaml: |
    version: v3
    teleport:
      data_dir: /var/lib/teleport
      log:
        output: stderr
        severity: INFO
      storage:
        type: etcd
        prefix: /teleport
        endpoints:
          - http://etcd-0.etcd.teleport.svc.cluster.local:2379

    auth_service:
      enabled: true
      listen_addr: 0.0.0.0:3025
      # 👇 Force the Auth/Secrets layer to use etcd, not file
      storage:
        type: etcd
        prefix: /teleport
        endpoints:
          - http://etcd-0.etcd.teleport.svc.cluster.local:2379

    proxy_service:
      enabled: true
      web_listen_addr: 0.0.0.0:3080

    ssh_service:
      enabled: false
---
# ============================
# Teleport Deployment
# ============================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teleport
  namespace: teleport
  labels:
    app: teleport
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teleport
  template:
    metadata:
      labels:
        app: teleport
    spec:
      # If you want to pin to a specific node:
      # nodeSelector:
      #   dedicated: srvr-node
      initContainers:
        - name: wait-for-etcd
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              host="etcd-0.etcd.teleport.svc.cluster.local"
              echo "Waiting for DNS: $host"
              until nslookup "$host" >/dev/null 2>&1; do
                sleep 2
              done
              echo "Waiting for TCP 2379 on $host"
              until nc -z "$host" 2379 >/dev/null 2>&1; do
                sleep 2
              done
              echo "etcd is up"
      containers:
        - name: teleport
          image: public.ecr.aws/gravitational/teleport-distroless:18.1.4
          imagePullPolicy: IfNotPresent
          command: ["teleport", "start", "-c", "/etc/teleport/teleport.yaml"]
          ports:
            - name: auth
              containerPort: 3025
            - name: web
              containerPort: 3080
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: teleport-config
              mountPath: /etc/teleport
              readOnly: true
            - name: teleport-data
              mountPath: /var/lib/teleport
          readinessProbe:
            tcpSocket:
              port: 3080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3080
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: teleport-config
          configMap:
            name: teleport-config
        - name: teleport-data
          emptyDir: {}    # fine because real state is in etcd
---
# ============================
# Teleport Service (ClusterIP)
# ============================
# Teleport Service (ClusterIP)
# ============================
apiVersion: v1
kind: Service
metadata:
  name: teleport
  namespace: teleport
spec:
  selector:
    app: teleport
  ports:
    - name: web
      port: 3080
      targetPort: 3080
    - name: auth
      port: 3025
      targetPort: 3025
  type: ClusterIP
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: teleport-route
  namespace: teleport
  annotations:
    apisix.apache.org/timeout: "900"
    apisix.apache.org/websocket: "true"
spec:
  ingressClassName: apisix
  http:
    - name: webui
      websocket: true
      match:
        hosts:
          - teleport.app.suncoast.systems
        paths:
          - /*
      backends:
        - serviceName: teleport
          servicePort: 3080
