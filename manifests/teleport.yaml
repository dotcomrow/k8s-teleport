---
# ============================
# Namespace (Linkerd off)
# ============================
apiVersion: v1
kind: Namespace
metadata:
  name: teleport
  labels:
    app: teleport
  annotations:
    linkerd.io/inject: disabled
    field.cattle.io/projectId: local:infrastructure
    argocd.argoproj.io/sync-wave: "-5"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: etcd-tls-bootstrap
  namespace: teleport
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-writer
  namespace: teleport
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get","create","update","patch","delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-writer-binding
  namespace: teleport
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
subjects:
- kind: ServiceAccount
  name: etcd-tls-bootstrap
  namespace: teleport
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-writer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: teleport-sa
  namespace: teleport
---
# Impersonation for K8s access via Teleport
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: teleport-kube-impersonator
rules:
- apiGroups: [""]
  resources: ["users","groups","serviceaccounts"]
  verbs: ["impersonate"]
- apiGroups: ["authentication.k8s.io"]
  resources: ["userextras/*"]
  verbs: ["impersonate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: teleport-kube-impersonator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: teleport-kube-impersonator
subjects:
- kind: ServiceAccount
  name: teleport-sa
  namespace: teleport
---
# Service discovery for auto-registration of annotated services
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: teleport-service-discovery
rules:
- apiGroups: [""]
  resources: ["services", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: teleport-service-discovery-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: teleport-service-discovery
subjects:
- kind: ServiceAccount
  name: teleport-sa
  namespace: teleport
---
# ============================
# Watchdog RBAC (allow pod self-delete for auto-restart)
# ============================
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: teleport-self-kill
  namespace: teleport
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get","delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: teleport-self-kill-binding
  namespace: teleport
subjects:
- kind: ServiceAccount
  name: teleport-sa
  namespace: teleport
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: teleport-self-kill
---
# ============================
# PreSync: generate etcd TLS (CA + server cert)
# ============================
apiVersion: batch/v1
kind: Job
metadata:
  name: etcd-tls-bootstrap
  namespace: teleport
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      serviceAccountName: etcd-tls-bootstrap
      restartPolicy: OnFailure
      volumes:
        - name: work
          emptyDir: {}
      containers:
        - name: bootstrap
          image: alpine:3.19
          volumeMounts:
            - name: work
              mountPath: /work
          command: ["/bin/sh","-c"]
          args:
            - |
              set -eu
              apk add --no-cache openssl kubectl

              if kubectl -n teleport get secret etcd-tls >/dev/null 2>&1; then
                echo "etcd-tls already exists; skipping bootstrap"
                exit 0
              fi

              # ----- CA extensions (real CA) -----
              cat >/work/ca.cnf <<'CNF'
              [v3_ca]
              basicConstraints = critical, CA:true
              keyUsage = critical, keyCertSign, cRLSign
              subjectKeyIdentifier = hash
              authorityKeyIdentifier = keyid:always,issuer
              CNF

              # ----- Server/Peer cert needs BOTH serverAuth + clientAuth -----
              cat >/work/server.cnf <<'CNF'
              [v3_server_peer]
              basicConstraints = CA:FALSE
              keyUsage = critical, digitalSignature, keyEncipherment
              extendedKeyUsage = serverAuth, clientAuth
              subjectAltName = @alt_names
              [alt_names]
              DNS.1 = etcd-0.etcd.teleport.svc.cluster.local
              DNS.2 = etcd.teleport.svc
              DNS.3 = etcd.teleport.svc.cluster.local
              DNS.4 = localhost
              IP.1  = 127.0.0.1
              CNF

              # ----- Client cert (Teleport) needs clientAuth -----
              cat >/work/client.cnf <<'CNF'
              [v3_client]
              basicConstraints = CA:FALSE
              keyUsage = critical, digitalSignature, keyEncipherment
              extendedKeyUsage = clientAuth
              CNF

              # Generate CA
              openssl genrsa -out /work/ca.key 4096
              openssl req -new -x509 -key /work/ca.key -sha256 -days 3650 \
                -subj "/CN=etcd-ca" \
                -extensions v3_ca -config /work/ca.cnf \
                -out /work/ca.crt

              # Generate server/peer key + CSR
              openssl genrsa -out /work/server.key 2048
              openssl req -new -key /work/server.key \
                -subj "/CN=etcd-0.etcd.teleport.svc.cluster.local" \
                -out /work/server.csr
              # Sign server with BOTH EKUs
              openssl x509 -req -in /work/server.csr -CA /work/ca.crt -CAkey /work/ca.key \
                -CAcreateserial -out /work/server.crt -days 3650 -sha256 \
                -extensions v3_server_peer -extfile /work/server.cnf

              # Generate Teleport client key + CSR
              openssl genrsa -out /work/client.key 2048
              openssl req -new -key /work/client.key \
                -subj "/CN=teleport" \
                -out /work/client.csr
              # Sign client with clientAuth EKU
              openssl x509 -req -in /work/client.csr -CA /work/ca.crt -CAkey /work/ca.key \
                -CAcreateserial -out /work/client.crt -days 3650 -sha256 \
                -extensions v3_client -extfile /work/client.cnf

              chmod 0644 /work/ca.crt /work/server.crt /work/client.crt
              chmod 0640 /work/server.key /work/client.key

              kubectl -n teleport create secret generic etcd-tls \
                --from-file=ca.crt=/work/ca.crt \
                --from-file=server.crt=/work/server.crt \
                --from-file=server.key=/work/server.key \
                --from-file=client.crt=/work/client.crt \
                --from-file=client.key=/work/client.key \
                --dry-run=client -o yaml | kubectl apply -f -
---
# ============================
# etcd headless Service
# ============================
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: teleport
  labels:
    app: etcd
spec:
  clusterIP: None
  selector:
    app: etcd
  ports:
    - name: client
      port: 2379
      targetPort: 2379
    - name: peer
      port: 2380
      targetPort: 2380
---
# ============================
# etcd StatefulSet (single node, TLS)
# ============================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: teleport
spec:
  serviceName: etcd
  replicas: 1
  updateStrategy:
    type: OnDelete
    rollingUpdate: null
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      volumes:
        - name: etcd-tls
          secret:
            secretName: etcd-tls
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.14
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/etcd"]
          args:
            - --name=$(POD_NAME)
            - --data-dir=/etcd-data
            # Client TLS
            - --listen-client-urls=https://0.0.0.0:2379
            - --advertise-client-urls=https://$(POD_NAME).etcd.teleport.svc.cluster.local:2379
            - --trusted-ca-file=/etc/etcd/pki/ca.crt
            - --cert-file=/etc/etcd/pki/server.crt
            - --key-file=/etc/etcd/pki/server.key
            # Peer TLS
            - --listen-peer-urls=https://0.0.0.0:2380
            - --initial-advertise-peer-urls=https://$(POD_NAME).etcd.teleport.svc.cluster.local:2380
            - --peer-trusted-ca-file=/etc/etcd/pki/ca.crt
            - --peer-cert-file=/etc/etcd/pki/server.crt
            - --peer-key-file=/etc/etcd/pki/server.key
            - --initial-cluster=etcd-0=https://etcd-0.etcd.teleport.svc.cluster.local:2380
            - --initial-cluster-state=new
            - --initial-cluster-token=etcd-cluster-1
            - --logger=zap
            - --log-level=info
            - --client-cert-auth=false
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 2379
              name: client
            - containerPort: 2380
              name: peer
          readinessProbe:
            tcpSocket: { port: 2379 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 2379 }
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: etcd-data
              mountPath: /etcd-data
            - name: etcd-tls
              mountPath: /etc/etcd/pki
              readOnly: true
  volumeClaimTemplates:
    - metadata:
        name: etcd-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
# ============================
# Legacy iDRAC TLS bridge (Nginx)
# Allows Teleport to talk HTTP in-cluster while Nginx speaks TLS1.0 to iDRAC and rewrites absolute URLs
# ============================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: idrac-bridge
  namespace: teleport
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: idrac-bridge-haproxy
  namespace: teleport
data:
  nginx.conf: |
    worker_processes  auto;
    events { worker_connections  4096; }
    http {
      log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
      access_log /dev/stdout main;
      error_log  /dev/stderr notice;
      proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=idrac_cache:50m max_size=2g inactive=365d use_temp_path=off;

      map $uri $idrac_cache_bypass {
        default "1";
        ~*\.(?:css|js|png|jpe?g|gif|ico|svg|ttf|woff2?|map|jnlp|jar)$ "";
      }

      upstream idrac_upstream {
        server 10.0.2.10:443;
        keepalive 16;
      }

      server {
        listen 8080;

        # Talk to legacy iDRAC over TLS1.0 and ignore its cert.
        resolver 1.1.1.1 valid=300s ipv6=off;

        # Force simple filename for JNLP downloads (handles extra path suffix like viewer.jnlp(...)).
        location ~* \.jnlp.* {
          add_header Content-Disposition 'attachment; filename="idrac.jnlp"' always;
          add_header Content-Type application/x-java-jnlp-file always;
          proxy_hide_header Content-Disposition;
          proxy_hide_header Content-Type;
          proxy_cache idrac_cache;
          proxy_cache_key "$scheme$proxy_host$request_uri";
          proxy_cache_methods GET HEAD;
          proxy_cache_valid 200 301 302 3650d;
          proxy_cache_valid any 10m;
          proxy_cache_min_uses 1;
          proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
          proxy_cache_lock on;
          proxy_cache_background_update on;
          proxy_cache_revalidate off;
          proxy_cache_bypass $idrac_cache_bypass;
          proxy_no_cache $idrac_cache_bypass;
          proxy_ignore_headers Cache-Control Expires;
          add_header X-Cache-Status $upstream_cache_status always;
          add_header Cache-Control "public, max-age=31536000, immutable";
          expires 365d;
          proxy_pass https://idrac_upstream;
          proxy_ssl_server_name off;
          proxy_ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
          proxy_ssl_ciphers ALL:@SECLEVEL=0;
          proxy_ssl_verify off;
          proxy_ssl_session_reuse on;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_set_header Host 10.0.2.10;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

          proxy_redirect https://10.0.2.10/ https://idrac.teleport.app.suncoast.systems/;
          proxy_redirect https://10.0.2.10:443/ https://idrac.teleport.app.suncoast.systems/;
          proxy_cookie_domain 10.0.2.10 idrac.teleport.app.suncoast.systems;

          sub_filter_once off;
          sub_filter_types *;
          sub_filter "https://10.0.2.10:443" "https://idrac.teleport.app.suncoast.systems";
          sub_filter "http://10.0.2.10:443" "https://idrac.teleport.app.suncoast.systems";
          sub_filter "https://10.0.2.10" "https://idrac.teleport.app.suncoast.systems";
          sub_filter "http://10.0.2.10" "https://idrac.teleport.app.suncoast.systems";
          # Keep the JNLP KVM endpoint on the public hostname.
          sub_filter "ip=10.0.2.10" "ip=idrac.teleport.app.suncoast.systems";
          proxy_set_header Accept-Encoding "";
        }

        # Serve locally re-signed jars first; fall back to backend if missing.
        location / {
          try_files $uri @idrac_backend;
        }

        location @idrac_backend {
          proxy_pass https://idrac_upstream;
          proxy_ssl_server_name off;
          proxy_ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
          proxy_ssl_ciphers ALL:@SECLEVEL=0;
          proxy_ssl_verify off;
          proxy_ssl_session_reuse on;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_set_header Host 10.0.2.10;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

          # Rewrite absolute redirects/cookie domains to stay on Teleport.
          proxy_redirect https://10.0.2.10/ https://idrac.teleport.app.suncoast.systems/;
          proxy_redirect https://10.0.2.10:443/ https://idrac.teleport.app.suncoast.systems/;
          proxy_cookie_domain 10.0.2.10 idrac.teleport.app.suncoast.systems;

          # Rewrite absolute URLs in HTML/CSS/JS responses.
          sub_filter_once off;
          # Filter all MIME types so JNLP and static assets get rewritten (avoid duplicate mime warnings).
          sub_filter_types *;
          sub_filter "https://10.0.2.10:443" "https://idrac.teleport.app.suncoast.systems";
          sub_filter "http://10.0.2.10:443" "https://idrac.teleport.app.suncoast.systems";
          sub_filter "https://10.0.2.10" "https://idrac.teleport.app.suncoast.systems";
          sub_filter "http://10.0.2.10" "https://idrac.teleport.app.suncoast.systems";
          # Keep the JNLP KVM endpoint on the public hostname.
          sub_filter "ip=10.0.2.10" "ip=idrac.teleport.app.suncoast.systems";
          proxy_set_header Accept-Encoding "";

          # Cache static GET/HEAD responses so we only hit iDRAC once for assets.
          proxy_cache idrac_cache;
          proxy_cache_key "$scheme$proxy_host$request_uri";
          proxy_cache_methods GET HEAD;
          proxy_cache_valid 200 301 302 3650d;
          proxy_cache_valid any 10m;
          proxy_cache_min_uses 1;
          proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
          proxy_cache_lock on;
          proxy_cache_background_update on;
          proxy_cache_revalidate off;
          proxy_cache_bypass $idrac_cache_bypass;
          proxy_no_cache $idrac_cache_bypass;
          proxy_ignore_headers Cache-Control Expires;
          add_header X-Cache-Status $upstream_cache_status always;

          proxy_buffering on;
          proxy_buffers 32 64k;
          proxy_busy_buffers_size 256k;
          proxy_max_temp_file_size 0;

          proxy_connect_timeout 30s;
          proxy_read_timeout 300s;
          proxy_send_timeout 300s;
        }
      }
    }
  stunnel.conf: |
    pid = /var/run/stunnel.pid
    foreground = yes
    debug = 4
    output = /dev/stdout
    client = yes
    verify = 0
    # Allow TLS1.x/1.2 while still permitting SSLv3 for the legacy target
    sslVersion = all
    options = -NO_SSLv3
    ciphers = ALL
    TIMEOUTconnect = 10

    [kvm]
    accept = 0.0.0.0:5900
    connect = 10.0.2.10:5900
  openssl.cnf: |
    # Minimal config for legacy TLS1.0/weak ciphers on old OpenSSL
    [system_default_sect]
    MinProtocol = SSLv3
    CipherString = ALL
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: idrac-cache-nfs
  namespace: teleport
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idrac-bridge
  namespace: teleport
  labels:
    app: idrac-bridge
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: idrac-bridge
  template:
    metadata:
      labels:
        app: idrac-bridge
    spec:
      serviceAccountName: idrac-bridge
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          args: ["nginx","-g","daemon off;","-c","/etc/nginx/nginx.conf"]
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-cache
              mountPath: /var/cache/nginx
        - name: kvm-proxy
          image: ghcr.io/dotcomrow/kvm-proxy:7a65641c8fe1f1d4c1b29ee2bf79453edf099b63
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # Generate a throwaway cert for the modern-facing listener
              mkdir -p /tmp/stunnel
              openssl req -new -x509 -nodes -subj "/CN=idrac-bridge" -days 3650 \
                -out /tmp/stunnel/cert.pem -keyout /tmp/stunnel/key.pem >/dev/null 2>&1

              # stunnel in a dual-hop: front terminates modern TLS, back re-encrypts to legacy SSLv3
              cat >/tmp/stunnel/stunnel.conf <<'CONF'
              pid = /var/run/stunnel.pid
              foreground = yes
              debug = 4
              output = /dev/stdout

              # Frontend: modern TLS for clients
              [front-kvm]
              accept = 0.0.0.0:5900
              connect = 127.0.0.1:15000
              cert = /tmp/stunnel/cert.pem
              key  = /tmp/stunnel/key.pem
              # Accept modern TLS from clients (allow TLS1.x)
              sslVersion = all
              options = NO_SSLv2
              # Allow legacy Java clients that only offer older ciphers.
              ciphers = ALL:!aNULL:!eNULL

              # Backend: client to iDRAC using legacy SSLv3/TLS1.0 as needed
              [back-kvm]
              client = yes
              accept = 127.0.0.1:15000
              connect = 10.0.2.10:5900
              # Allow TLS1.x or SSLv3 as the iDRAC supports
              sslVersion = all
              options = NO_SSLv2
              ciphers = ALL:!aNULL:!eNULL
              verify = 0
              TIMEOUTconnect = 10
              CONF

              echo "starting stunnel TLS bridge: client<->(TLS1.2)front -> (SSLv3)idrac"
              exec stunnel /tmp/stunnel/stunnel.conf
          ports:
            - containerPort: 5900
              name: kvm
        - name: diag
          image: alpine:3.8
          command: ["/bin/sh","-c","apk add --no-cache curl openssl busybox-extras && exec sleep 99999999"]
          env:
            - name: OPENSSL_CONF
              value: /etc/stunnel/openssl.cnf
          volumeMounts:
            - name: config
              mountPath: /etc/stunnel/openssl.cnf
              subPath: openssl.cnf
      volumes:
        - name: config
          configMap:
            name: idrac-bridge-haproxy
        - name: nginx-cache
          persistentVolumeClaim:
            claimName: idrac-cache-nfs
---
apiVersion: v1
kind: Service
metadata:
  name: idrac-bridge
  namespace: teleport
spec:
  selector:
    app: idrac-bridge
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: kvm
      port: 5900
      targetPort: kvm
---
# Optional external exposure for KVM TCP (5900) via NodePort/LB
apiVersion: v1
kind: Service
metadata:
  name: idrac-bridge-kvm
  namespace: teleport
spec:
  type: LoadBalancer   # change to NodePort if preferred
  loadBalancerIP: 10.0.0.150
  selector:
    app: idrac-bridge
  ports:
    - name: kvm
      port: 5900
      targetPort: kvm
---
# ============================
# iDRAC6 HTML5/VNC console (domistyle/idrac6) with Vault-injected creds
# ============================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: idrac6-vault-setup
  namespace: teleport
---
apiVersion: batch/v1
kind: Job
metadata:
  name: copy-teleport-vault-root-token
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-4"
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: default
      restartPolicy: Never
      containers:
        - name: copy-secret
          image: alpine/k8s:1.31.4
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              apk add --no-cache jq >/dev/null
              echo "Copying vault-root-token from vault -> teleport"
              kubectl get secret vault-root-token -n vault -o json \
                | jq '
                    .metadata.namespace="teleport"
                    | del(.metadata.uid,.metadata.resourceVersion,.metadata.creationTimestamp,.metadata.managedFields,.metadata.annotations,.metadata.ownerReferences,.metadata.finalizers,.metadata.generateName,.metadata.selfLink,.metadata.generation,.metadata.labels,.metadata.annotations)
                    | ( .data.token //= ( .data | to_entries | (.[0].value // "") ) )
                  ' \
                | kubectl apply -f -
              echo "Secret copied successfully."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: idrac6-vault-bootstrap-v4
  namespace: teleport
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
  labels:
    app: idrac6-vault-bootstrap-v4
spec:
  backoffLimit: 2
  selector:
    matchLabels:
      app: idrac6-vault-bootstrap-v4
  template:
    metadata:
      labels:
        app: idrac6-vault-bootstrap-v4
    spec:
      serviceAccountName: idrac6-vault-setup
      restartPolicy: Never
      containers:
        - name: vault-bootstrap
          image: hashicorp/vault:1.14.3
          env:
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault-root-token
                  key: token
            - name: VAULT_AUTH_PATH
              value: "kubernetes"
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail

              vault status >/dev/null

              cat > /tmp/idrac6-console.hcl <<'POLICY'
              path "secret/data/idrac6-host" {
                capabilities = ["read"]
              }
              path "secret/data/idrac6-user" {
                capabilities = ["read"]
              }
              path "secret/data/idrac6-password" {
                capabilities = ["read"]
              }
              POLICY

              echo "Writing policy idrac6-console"
              vault policy write idrac6-console /tmp/idrac6-console.hcl

              echo "Writing Kubernetes auth role idrac6-console"
              vault write "auth/${VAULT_AUTH_PATH}/role/idrac6-console" \
                bound_service_account_names=idrac6-console \
                bound_service_account_namespaces=teleport \
                policies=idrac6-console \
                ttl=24h

              echo "Vault bootstrap complete"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: idrac6-console
  namespace: teleport
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idrac6-console
  namespace: teleport
  labels:
    app: idrac6-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: idrac6-console
  template:
    metadata:
      labels:
        app: idrac6-console
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "idrac6-console"
        vault.hashicorp.com/agent-inject-secret-idrac-host.env: "secret/data/idrac6-host"
        vault.hashicorp.com/agent-inject-template-idrac-host.env: |
          {{- with secret "secret/data/idrac6-host" -}}
          IDRAC_HOST={{ .Data.data.value }}
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-idrac-user.env: "secret/data/idrac6-user"
        vault.hashicorp.com/agent-inject-template-idrac-user.env: |
          {{- with secret "secret/data/idrac6-user" -}}
          IDRAC_USER={{ .Data.data.value }}
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-idrac-password.env: "secret/data/idrac6-password"
        vault.hashicorp.com/agent-inject-template-idrac-password.env: |
          {{- with secret "secret/data/idrac6-password" -}}
          IDRAC_PASSWORD={{ .Data.data.value }}
          {{- end }}
    spec:
      serviceAccountName: idrac6-console
      containers:
        - name: idrac6
          image: domistyle/idrac6:latest
          command:
            - /bin/sh
            - -c
            - |
              set -a
              [ -f /vault/secrets/idrac-host.env ] && . /vault/secrets/idrac-host.env
              [ -f /vault/secrets/idrac-user.env ] && . /vault/secrets/idrac-user.env
              [ -f /vault/secrets/idrac-password.env ] && . /vault/secrets/idrac-password.env
              exec /init
          ports:
            - name: web
              containerPort: 5800
            - name: vnc
              containerPort: 5900
---
apiVersion: v1
kind: Service
metadata:
  name: idrac6-console
  namespace: teleport
spec:
  selector:
    app: idrac6-console
  ports:
    - name: web
      port: 80
      targetPort: web
    - name: vnc
      port: 5900
      targetPort: vnc
