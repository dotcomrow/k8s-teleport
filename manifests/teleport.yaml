---
apiVersion: v1
kind: ConfigMap
metadata:
  name: teleport-config
data:
  teleport.yaml: |
    version: v3
    teleport:
      nodename: teleport
      data_dir: /var/lib/teleport
      log:
        output: stderr
        severity: INFO
    storage:
      type: postgres
      connection_string: ${TELEPORT_DB_URL}
      # For full details, see: https://goteleport.com/docs/management/admin/postgres/
    auth_service:
      enabled: yes
      listen_addr: 0.0.0.0:3025
    ssh_service:
      enabled: yes
      listen_addr: 0.0.0.0:3023
    proxy_service:
      enabled: yes
      listen_addr: 0.0.0.0:3080
---
apiVersion: batch/v1
kind: Job
metadata:
  name: copy-teleport-vault-root-token
  namespace: vault
spec:
  backoffLimit: 1
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      serviceAccountName: default
      restartPolicy: Never
      containers:
        - name: copy-secret
          image: alpine/k8s:1.31.4
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          command:
            - /bin/sh
            - -c
            - |
              echo "🔁 Copying 'vault-root-token' from vault → teleport..."
              kubectl get secret vault-root-token -n vault -o yaml | \
                sed 's/namespace: vault/namespace: teleport/' | \
                kubectl apply -f -
              echo "✅ Secret copied successfully."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: teleport-yugabyte-config
  namespace: teleport
spec:
  backoffLimit: 1
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: root-token
          secret:
            secretName: vault-root-token

      containers:
        - name: setup-role
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh", "-c"]
          args:
            - |
              #!/bin/sh
              set -euo pipefail

              PGHOST=yb-tserver-service.yugabyte.svc.cluster.local
              PGPORT=5433
              DB=teleport
              ROLE=teleport
              VAULTADMIN_USER=vaultadmin

              # Install PostgreSQL client tools
              apk add --no-cache bash curl postgresql15-client jq

              export PATH=$PATH:/vault-bin
              export VAULT_ADDR=http://vault.vault.svc.cluster.local:8200

              # --- Wait for Vault token ---
              while [ ! -f /vault-token/VAULT_TOKEN ]; do
                echo "🔁 Waiting for Vault token file..."
                sleep 2
              done
              export VAULT_TOKEN=$(cat /vault-token/VAULT_TOKEN)

              # --- Wait for DB availability ---
              until getent hosts "$PGHOST" >/dev/null; do
                echo "🔄 Waiting for DNS for $PGHOST..."
                sleep 3
              done
              until nc -z -w1 "$PGHOST" "$PGPORT"; do
                echo "⏳ Waiting for DB port $PGPORT..."
                sleep 3
              done
              echo "✅ YugabyteDB is reachable"

              # --- Fetch vaultadmin password from Vault ---
              echo "🔐 Fetching vaultadmin password from Vault..."
              while true; do
                VAULTADMIN_PASS="$(vault kv get -field=value secret/$VAULTADMIN_USER 2>/dev/null || true)"
                if [ -n "$VAULTADMIN_PASS" ]; then
                  export PGPASSWORD="$VAULTADMIN_PASS"
                  break
                fi
                echo "🔁 Waiting for secret/$VAULTADMIN_USER to become available..."
                sleep 3
              done

              # --- Ensure $DB database exists ---
              while true; do
                echo "📦 Checking if $DB exists..."
                DB_EXISTS=$(psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte -tAc "SELECT 1 FROM pg_database WHERE datname='$DB'" 2>/dev/null || true)

                if [[ "$DB_EXISTS" == "1" ]]; then
                  echo "✅ Database $DB already exists"
                  break
                fi

                echo "📦 Creating database $DB..."
                if createdb -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -O "$VAULTADMIN_USER" "$DB" 2>/dev/null; then
                  echo "✅ Database $DB created successfully"
                  break
                else
                  echo "🔁 Waiting for Yugabyte to accept DB operations..."
                  sleep 3
                fi
              done

              # --- Ensure ROLE exists ---
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte <<EOSQL
              DO \$\$
              BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '$ROLE') THEN
                  CREATE ROLE $ROLE;
                END IF;
              END
              \$\$;
              EOSQL

              while true; do
                echo "📦 Attempting to create teleport schema and grant privileges..."
                
                psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$DB" <<EOSQL
                CREATE SCHEMA IF NOT EXISTS teleport AUTHORIZATION $VAULTADMIN_USER;
                ALTER SCHEMA teleport OWNER TO $VAULTADMIN_USER;
                GRANT $ROLE TO $VAULTADMIN_USER;
                -- Grants for app role
                GRANT USAGE, CREATE ON SCHEMA teleport TO $ROLE;
                GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA teleport TO $ROLE;
                GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA teleport TO $ROLE;
                ALTER DEFAULT PRIVILEGES IN SCHEMA teleport GRANT ALL ON TABLES TO $ROLE;
                ALTER DEFAULT_PRIVILEGES IN SCHEMA teleport GRANT USAGE, SELECT ON SEQUENCES TO $ROLE;

                -- Grants for vaultadmin (both existing and future)
                GRANT USAGE, CREATE ON SCHEMA teleport TO $VAULTADMIN_USER;
                GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA teleport TO $VAULTADMIN_USER;
                GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA teleport TO $VAULTADMIN_USER;
                ALTER DEFAULT PRIVILEGES IN SCHEMA teleport GRANT ALL ON TABLES TO $VAULTADMIN_USER;
                ALTER DEFAULT PRIVILEGES IN SCHEMA teleport GRANT ALL ON SEQUENCES TO $VAULTADMIN_USER;
              EOSQL

                if [ $? -eq 0 ]; then
                  echo "✅ Schema creation and grants completed successfully."
                  break
                else
                  echo "⚠️ Schema creation failed. Retrying in 5 seconds..."
                  sleep 5
                fi
              done

              # --- Ensure ROLE exists (idempotent) ---
              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte <<'EOSQL'
              DO $$
              BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'teleport') THEN
                  CREATE ROLE teleport NOLOGIN;
                END IF;
              END
              $$;
              EOSQL

              # --- Wait for catalog propagation ---
              echo "⏳ Waiting for role 'teleport' to be visible on all t-servers..."
              attempt=0
              while true; do
                attempt=$((attempt + 1))
                if psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte -tAc \
                    "SELECT 1 FROM pg_roles WHERE rolname = 'teleport'" | grep -q 1; then
                  echo "✅ Role propagated after $attempt attempt(s)"
                  break
                fi
                echo "🔄 Attempt $attempt: role not yet visible; retrying in 1 s..."
                sleep 1
              done

              # --- Create dynamic Vault role ---
              echo "🔐 Creating dynamic Vault role..."
              vault write yugabyte-db/roles/$ROLE \
                db_name=yugabyte \
                creation_statements="CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}' INHERIT IN ROLE $ROLE VALID UNTIL '{{expiration}}';" \
                default_ttl="48h" \
                max_ttl="48h"

              echo "✅ Vault role '$ROLE' created"

              # --- Create Vault policy ---
              echo "📜 Writing Vault policy '$ROLE'..."
              vault policy write "$ROLE" - <<EOF
              path "yugabyte-db/creds/$ROLE" {
                capabilities = ["read"]
              }
              EOF

              # --- Bind K8s SA to Vault role ---
              echo "🔗 Binding Kubernetes SA to Vault role..."
              vault write auth/kubernetes/role/$ROLE \
                bound_service_account_names="$ROLE" \
                bound_service_account_namespaces="teleport" \
                policies="$ROLE" \
                ttl=48h

              echo "🔁 Verifying Vault credential issuance for role: ${ROLE:-<unset>} ..."
              attempt=0
              delay=2   # start with 2s, will back off up to 30s

              while true; do
                attempt=$((attempt + 1))

                CREDS_JSON="$(vault read -format=json "yugabyte-db/creds/${ROLE}" 2>/dev/null || true)"

                # Validate: non-empty JSON; if jq is present, also ensure username/password exist
                if [ -n "$CREDS_JSON" ]; then
                  if command -v jq >/dev/null 2>&1; then
                    if printf '%s' "$CREDS_JSON" \
                      | jq -e '.data.username and .data.password' >/dev/null 2>&1; then
                      echo "✅ Credentials issued on attempt $attempt."
                      break
                    fi
                  else
                    echo "ℹ️ 'jq' not found; accepting non-empty JSON."
                    echo "✅ Credentials issued on attempt $attempt."
                    break
                  fi
                fi

                echo "❌ Attempt $attempt: Failed to issue dynamic credentials from Vault. Retrying in ${delay}s..."
                sleep "$delay"
                # Exponential backoff capped at 30s
                if [ "$delay" -lt 30 ]; then
                  delay=$(( delay * 2 ))
                  [ "$delay" -gt 30 ] && delay=30
                fi
              done

              DB_USER=$(echo "$CREDS_JSON" | jq -r .data.username)
              DB_PASS=$(echo "$CREDS_JSON" | jq -r .data.password)
              export PGPASSWORD="$DB_PASS"

              # --- Function to run and log SQL ---
              run_psql() {
                local SQL="$1"
                echo "🔎 Running SQL:"
                echo "$SQL"
                echo "--------------------------"
                set +e
                echo "$SQL" | psql -h "$PGHOST" -p "$PGPORT" -U "$DB_USER" -d "$DB" -v ON_ERROR_STOP=1 2>&1 | tee /tmp/psql_output.log
                STATUS=$?
                set -e
                echo "🔎 Exit status: $STATUS"
                if [ "$STATUS" -ne 0 ]; then
                  echo "❌ psql failed:"
                  cat /tmp/psql_output.log
                  exit $STATUS
                fi
              }

              # --- Validate permissions ---
              echo "🔍 Validating dynamic user permissions..."
              # --- Validate permissions ---
              # --- Set default privileges from dynamic user ---
              # Wrapper: never exits the parent shell even if run_psql calls exit or set -e is on
              safe_run_psql() {
                ( set +e; run_psql "$1" )
                return $?  # propagate subshell's exit code
              }

              attempt=0
              while true; do
                attempt=$((attempt+1))
                echo "📦 Attempt $attempt: setting grants and default privileges..."

                ok=true

                # Ensure schema exists (idempotent; remove if another step is responsible)
                # safe_run_psql "CREATE SCHEMA IF NOT EXISTS teleport AUTHORIZATION $VAULTADMIN_USER;" || ok=false
                safe_run_psql "ALTER SCHEMA teleport OWNER TO $VAULTADMIN_USER;" || ok=false

                # Grants to vaultadmin
                safe_run_psql "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA teleport TO vaultadmin;" || ok=false
                safe_run_psql "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA teleport TO vaultadmin;" || ok=false

                # Default privileges for $ROLE
                safe_run_psql "ALTER DEFAULT PRIVILEGES IN SCHEMA teleport GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO $ROLE;" || ok=false
                safe_run_psql "ALTER DEFAULT PRIVILEGES IN SCHEMA teleport GRANT USAGE, SELECT ON SEQUENCES TO $ROLE;" || ok=false

                # Default privileges for vaultadmin
                safe_run_psql "ALTER DEFAULT PRIVILEGES IN SCHEMA teleport GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO vaultadmin;" || ok=false
                safe_run_psql "ALTER DEFAULT PRIVILEGES IN SCHEMA teleport GRANT USAGE, SELECT ON SEQUENCES TO vaultadmin;" || ok=false

                if $ok; then
                  echo "✅ Grants and default privileges applied successfully."
                  break
                else
                  echo "⚠️ Failed to apply one or more statements. Retrying in 5 seconds..."
                  sleep 5
                fi
              done
              
              run_psql "SELECT current_user;"
              run_psql "SELECT has_schema_privilege(current_user, 'teleport', 'USAGE') AS schema_usage;"
              run_psql "SET ROLE $ROLE; CREATE TABLE IF NOT EXISTS teleport.test_perm_check (id SERIAL PRIMARY KEY); RESET ROLE;"
              run_psql "SELECT has_table_privilege(current_user, 'teleport.test_perm_check', 'SELECT,INSERT,UPDATE,DELETE') AS table_access;"
              run_psql "SELECT has_sequence_privilege(current_user, 'teleport.test_perm_check_id_seq', 'USAGE') AS sequence_usage;"
              run_psql "SELECT r.rolname FROM pg_roles r JOIN pg_auth_members m ON r.oid = m.roleid JOIN pg_roles u ON u.oid = m.member WHERE u.rolname = current_user;"

              echo "🎉 teleport Vault + Yugabyte initialization complete!"

          volumeMounts:
            - name: root-token
              mountPath: /vault-token
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sync-teleport-db-secret
  namespace: teleport
spec:
  schedule: "0 0 * * *"  # Every day
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          annotations:
            linkerd.io/inject: disabled
        spec:
          serviceAccountName: default
          restartPolicy: Never
          initContainers:
            - name: load-kubectl
              image: alpine/k8s:1.31.4
              command: ["sh", "-c"]
              args:
                - cp /usr/bin/kubectl /kubectl-bin/kubectl && chmod +x /kubectl-bin/kubectl
              volumeMounts:
                - name: kubectl-bin
                  mountPath: /kubectl-bin
          containers:
            - name: vault-sync
              image: ubuntu:22.04
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  RETRY_INTERVAL=5

                  echo "🔧 Installing tools..."
                  while true; do
                    apt-get update && apt-get install -y curl postgresql-client unzip jq && break
                    echo "⚠️ apt-get failed. Retrying in ${RETRY_INTERVAL}s..."
                    sleep "$RETRY_INTERVAL"
                  done

                  echo "📌 Installing Vault CLI..."
                  while true; do
                    curl -fsSL -o vault.zip https://releases.hashicorp.com/vault/1.15.4/vault_1.15.4_linux_amd64.zip && break
                    echo "⚠️ Failed to download Vault CLI. Retrying in ${RETRY_INTERVAL}s..."
                    sleep "$RETRY_INTERVAL"
                  done

                  unzip -o vault.zip >/dev/null
                  mv vault /usr/local/bin/
                  chmod +x /usr/local/bin/vault

                  echo "📌 Fetching dynamic Vault credentials for teleport..."
                  export VAULT_ADDR=http://vault.vault.svc.cluster.local:8200
                  export VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"

                  while true; do
                    CREDS_JSON=$(vault read -format=json yugabyte-db/creds/teleport 2>/tmp/vault_err.log || true)
                    if [ -n "$CREDS_JSON" ] && echo "$CREDS_JSON" | jq -e '.data.username and .data.password' >/dev/null; then
                      USERNAME=$(echo "$CREDS_JSON" | jq -r '.data.username')
                      PASSWORD=$(echo "$CREDS_JSON" | jq -r '.data.password')
                      echo "✅ Got credentials for user: $USERNAME"
                      break
                    fi
                    echo "⚠️ Vault credential fetch failed. Retrying in ${RETRY_INTERVAL}s..."
                    cat /tmp/vault_err.log
                    sleep "$RETRY_INTERVAL"
                  done

                  DB_URL="postgresql://${USERNAME}:${PASSWORD}@yb-tserver-service.yugabyte.svc.cluster.local:5433/teleport?options=-csearch_path%3Dteleport"
                  PGHOST=yb-tserver-service.yugabyte.svc.cluster.local
                  PGPORT=5433
                  export PGPASSWORD="$PASSWORD"
                  while true; do
                    echo "📦 Attempting to grant privileges..."

                    psql -h "$PGHOST" -p "$PGPORT" -U "$USERNAME" -d teleport <<EOSQL
                      ALTER DEFAULT PRIVILEGES IN SCHEMA teleport
                      GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO teleport;
                      ALTER DEFAULT PRIVILEGES IN SCHEMA teleport
                      GRANT USAGE, SELECT ON SEQUENCES TO teleport;

                      ALTER DEFAULT PRIVILEGES IN SCHEMA teleport
                      GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO vaultadmin;
                      ALTER DEFAULT PRIVILEGES IN SCHEMA teleport
                      GRANT USAGE, SELECT ON SEQUENCES TO vaultadmin;
                  EOSQL

                    if [ $? -eq 0 ]; then
                      echo "✅ Privileges granted successfully."
                      break
                    else
                      echo "⚠️ Failed to grant privileges. Retrying in ${RETRY_INTERVAL}s..."
                      sleep "$RETRY_INTERVAL"
                    fi
                  done

                  echo "🔐 Creating/updating Kubernetes secret..."
                  cat <<EOF | kubectl apply -f - 
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: teleport-db-secret
                    namespace: teleport
                  type: Opaque
                  stringData:
                    connection-string: ${DB_URL}
                  EOF

              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "256Mi"
              volumeMounts:
                - name: vault-token
                  mountPath: /vault-token
                  readOnly: true
                - name: kubectl-bin
                  mountPath: /usr/local/bin
          volumes:
            - name: vault-token
              secret:
                secretName: vault-root-token
            - name: kubectl-bin
              emptyDir: {}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-creator
  namespace: teleport
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: teleport-secret-manager
  namespace: teleport
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: teleport-secret-manager-binding
  namespace: teleport
subjects:
  - kind: ServiceAccount
    name: default
    namespace: teleport
roleRef:
  kind: Role
  name: teleport-secret-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-creator-binding
  namespace: teleport
subjects:
  - kind: ServiceAccount
    name: default
    namespace: teleport
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: job-creator
---
apiVersion: batch/v1
kind: Job
metadata:
  name: start-database-url-rotation-job
  namespace: teleport
spec:
  backoffLimit: 1
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
    spec:
      serviceAccountName: default
      restartPolicy: Never

      volumes:
        - name: kubectl-bin
          emptyDir: {}

      initContainers:
        - name: load-kubectl
          image: alpine/k8s:1.31.4
          command: ["sh", "-c"]
          args:
            - cp  /usr/bin/kubectl /kubectl-bin/kubectl && chmod +x /kubectl-bin/kubectl
          volumeMounts:
            - name: kubectl-bin
              mountPath: /kubectl-bin

      containers:
        - name: start-job
          image: alpine/k8s:1.31.4
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: kubectl-bin
              mountPath: /usr/local/bin

          command:
            - /bin/sh
            - -c
            - |
              echo "🔁 Triggering sync-teleport-db-secret-now from CronJob..."
              until kubectl create job --from=cronjob/sync-teleport-db-secret sync-teleport-db-secret-now -n teleport; do
                echo "⏳ Waiting for CronJob to be available..."
                sleep 3
              done
              echo "✅ Job successfully created"