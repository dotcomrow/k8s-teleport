---
# ============================
# Namespace (Linkerd off)
# ============================
apiVersion: v1
kind: Namespace
metadata:
  name: teleport
  labels:
    app: teleport
  annotations:
    linkerd.io/inject: disabled
    field.cattle.io/projectId: local:infrastructure
    scheduler.alpha.kubernetes.io/node-selector: "dedicated=srvr-node"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: etcd-tls-bootstrap
  namespace: teleport
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-writer
  namespace: teleport
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get","create","update","patch","delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-writer-binding
  namespace: teleport
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
subjects:
- kind: ServiceAccount
  name: etcd-tls-bootstrap
  namespace: teleport
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-writer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: teleport-sa
  namespace: teleport
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: teleport-kube-impersonator
rules:
- apiGroups: [""]
  resources: ["users","groups","serviceaccounts"]
  verbs: ["impersonate"]
- apiGroups: ["authentication.k8s.io"]
  resources: ["userextras/*"]
  verbs: ["impersonate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: teleport-kube-impersonator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: teleport-kube-impersonator
subjects:
- kind: ServiceAccount
  name: teleport-sa
  namespace: teleport
---
# ============================
# PreSync: generate etcd TLS (CA + server cert)
#   - writes Secret: etcd-tls  (ca.crt, server.crt, server.key)
# ============================
apiVersion: batch/v1
kind: Job
metadata:
  name: etcd-tls-bootstrap
  namespace: teleport
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      serviceAccountName: etcd-tls-bootstrap
      restartPolicy: OnFailure
      volumes:
        - name: work
          emptyDir: {}
      containers:
        - name: openssl
          image: alpine:3.19
          volumeMounts:
            - name: work
              mountPath: /work
          command: ["/bin/sh","-c"]
          args: 
            - |
              apk add --no-cache openssl

              # ----- CA extensions (real CA) -----
              cat >/work/ca.cnf <<'CNF'
              [v3_ca]
              basicConstraints = critical, CA:true
              keyUsage = critical, keyCertSign, cRLSign
              subjectKeyIdentifier = hash
              authorityKeyIdentifier = keyid:always,issuer
              CNF

              # ----- Server/Peer cert needs BOTH serverAuth + clientAuth -----
              cat >/work/server.cnf <<'CNF'
              [v3_server_peer]
              basicConstraints = CA:FALSE
              keyUsage = critical, digitalSignature, keyEncipherment
              extendedKeyUsage = serverAuth, clientAuth
              subjectAltName = @alt_names
              [alt_names]
              DNS.1 = etcd-0.etcd.teleport.svc.cluster.local
              DNS.2 = etcd.teleport.svc
              DNS.3 = etcd.teleport.svc.cluster.local
              DNS.4 = localhost
              IP.1  = 127.0.0.1
              CNF

              # ----- Client cert (Teleport) needs clientAuth -----
              cat >/work/client.cnf <<'CNF'
              [v3_client]
              basicConstraints = CA:FALSE
              keyUsage = critical, digitalSignature, keyEncipherment
              extendedKeyUsage = clientAuth
              CNF

              # Generate CA
              openssl genrsa -out /work/ca.key 4096
              openssl req -new -x509 -key /work/ca.key -sha256 -days 3650 \
                -subj "/CN=etcd-ca" \
                -extensions v3_ca -config /work/ca.cnf \
                -out /work/ca.crt

              # Generate server/peer key + CSR
              openssl genrsa -out /work/server.key 2048
              openssl req -new -key /work/server.key \
                -subj "/CN=etcd-0.etcd.teleport.svc.cluster.local" \
                -out /work/server.csr
              # Sign server with BOTH EKUs
              openssl x509 -req -in /work/server.csr -CA /work/ca.crt -CAkey /work/ca.key \
                -CAcreateserial -out /work/server.crt -days 3650 -sha256 \
                -extensions v3_server_peer -extfile /work/server.cnf

              # Generate Teleport client key + CSR
              openssl genrsa -out /work/client.key 2048
              openssl req -new -key /work/client.key \
                -subj "/CN=teleport" \
                -out /work/client.csr
              # Sign client with clientAuth EKU
              openssl x509 -req -in /work/client.csr -CA /work/ca.crt -CAkey /work/ca.key \
                -CAcreateserial -out /work/client.crt -days 3650 -sha256 \
                -extensions v3_client -extfile /work/client.cnf

              chmod 0644 /work/ca.crt /work/server.crt /work/client.crt
              chmod 0640 /work/server.key /work/client.key
              touch /work/ready
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
        - name: kubectl
          image: bitnami/kubectl:1.29
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: work
              mountPath: /work
          command: ["/bin/sh","-c"]
          args: 
            - |
              while [ ! -f /work/ready ]; do sleep 1; done
              kubectl -n teleport create secret generic etcd-tls \
                --from-file=ca.crt=/work/ca.crt \
                --from-file=server.crt=/work/server.crt \
                --from-file=server.key=/work/server.key \
                --from-file=client.crt=/work/client.crt \
                --from-file=client.key=/work/client.key \
                --dry-run=client -o yaml | kubectl apply -f -
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
# ============================
# etcd headless Service
# ============================
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: teleport
  labels:
    app: etcd
spec:
  clusterIP: None
  selector:
    app: etcd
  ports:
    - name: client
      port: 2379
      targetPort: 2379
    - name: peer
      port: 2380
      targetPort: 2380
---
# ============================
# etcd StatefulSet (single node, TLS)
# ============================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: teleport
spec:
  serviceName: etcd
  replicas: 1
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      volumes:
        - name: etcd-tls
          secret:
            secretName: etcd-tls
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.14
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/etcd"]
          args:
            - --name=$(POD_NAME)
            - --data-dir=/etcd-data
            # Client TLS
            - --listen-client-urls=https://0.0.0.0:2379
            - --advertise-client-urls=https://$(POD_NAME).etcd.teleport.svc.cluster.local:2379
            - --trusted-ca-file=/etc/etcd/pki/ca.crt
            - --cert-file=/etc/etcd/pki/server.crt
            - --key-file=/etc/etcd/pki/server.key
            # Peer TLS (single node but keep consistent)
            - --listen-peer-urls=https://0.0.0.0:2380
            - --initial-advertise-peer-urls=https://$(POD_NAME).etcd.teleport.svc.cluster.local:2380
            - --peer-trusted-ca-file=/etc/etcd/pki/ca.crt
            - --peer-cert-file=/etc/etcd/pki/server.crt
            - --peer-key-file=/etc/etcd/pki/server.key
            - --initial-cluster=etcd-0=https://etcd-0.etcd.teleport.svc.cluster.local:2380
            - --initial-cluster-state=new
            - --initial-cluster-token=etcd-cluster-1
            - --logger=zap
            - --log-level=info
            - --client-cert-auth=false
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 2379
              name: client
            - containerPort: 2380
              name: peer
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 2379
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 2379
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: etcd-data
              mountPath: /etcd-data
            - name: etcd-tls
              mountPath: /etc/etcd/pki
              readOnly: true
  volumeClaimTemplates:
    - metadata:
        name: etcd-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
# ============================
# Teleport config (ConfigMap)
# ============================
apiVersion: v1
kind: ConfigMap
metadata:
  name: teleport-config
  namespace: teleport
data:
  teleport.yaml: |
    version: v3
    teleport:
      data_dir: /var/lib/teleport
      log:
        output: stderr
        severity: INFO
      storage:
        type: etcd
        peers:
          - https://etcd-0.etcd.teleport.svc.cluster.local:2379
        prefix: /teleport/
        tls_ca_file:   /etc/etcd-ca/ca.crt
        tls_cert_file: /etc/etcd-ca/client.crt
        tls_key_file:  /etc/etcd-ca/client.key

    app_service:
      enabled: true
      apps:
        - name: k8s-mgmt-console
          uri: https://rancher.cattle-system.svc.cluster.local
          public_addr: k8s.app.suncoast.systems
          insecure_skip_verify: true
          rewrite:
            headers:
              - "Host: k8s.app.suncoast.systems"
              - "Origin: https://k8s.app.suncoast.systems"

        - name: apisix-gateway-console
          uri: http://oauth2-proxy.apisix.svc.cluster.local
          public_addr: gateway-manager.app.suncoast.systems

        - name: harbor-console
          uri: https://10.0.0.10
          public_addr: harbor.app.suncoast.systems
          insecure_skip_verify: true
          rewrite:
            headers:
              - "Host: harbor.app.suncoast.systems"

        - name: harbor-dex
          uri: https://10.0.0.10
          public_addr: harbor-dex.app.suncoast.systems
          insecure_skip_verify: true
          rewrite:
            headers:
              - "Host: harbor-dex.app.suncoast.systems"

        - name: vault
          uri: http://vault.vault.svc.cluster.local:8200
          public_addr: vault.app.suncoast.systems

        - name: vault-dex
          uri: http://dex.vault.svc.cluster.local:5556
          public_addr: vault-dex.app.suncoast.systems

        - name: argocd
          uri: http://argocd-server.argocd.svc.cluster.local
          public_addr: argocd.app.suncoast.systems

        - name: argocd-dex
          uri: http://argocd-dex-server.argocd.svc.cluster.local
          public_addr: argocd-dex.app.suncoast.systems

        - name: kyverno-console
          uri: http://policy-reporter-ui.policy-reporter.svc.cluster.local:8080
          public_addr: policy-reporter.app.suncoast.systems

        - name: linkerd-console
          uri: http://oauth2-proxy.linkerd-viz.svc.cluster.local
          public_addr: linkerd.app.suncoast.systems

        - name: jaeger-console
          uri: http://oauth2-proxy-jaeger.linkerd-jaeger.svc.cluster.local
          public_addr: jaeger.app.suncoast.systems

        - name: pgweb-console
          uri: http://oauth2-proxy-pgweb.yugabyte.svc.cluster.local:4180
          public_addr: pgweb.app.suncoast.systems

        - name: yugabyte-console
          uri: http://oauth2-proxy-yugabyte.yugabyte.svc.cluster.local:4180
          public_addr: yugabyte.app.suncoast.systems

        - name: openwebui-console
          uri: http://open-webui.ollama.svc.cluster.local
          public_addr: ai.app.suncoast.systems

        - name: pfsense
          uri: https://10.0.0.10
          public_addr: pfsense.app.suncoast.systems
          insecure_skip_verify: true
          rewrite:
            headers:
              - "Host: pfsense.suncoast.systems"

        - name: proxmox
          uri: https://10.0.0.10
          public_addr: proxmox.app.suncoast.systems
          insecure_skip_verify: true
          rewrite:
            headers:
              - "Host: proxmox.suncoast.systems"

    auth_service:
      enabled: true
      listen_addr: 0.0.0.0:3025
      proxy_listener_mode: multiplex
      authentication:
        type: github
        connector_name: new_github_connector
        local_auth: false
        second_factor: otp

    proxy_service:
      enabled: true
      web_listen_addr: 0.0.0.0:3080
      public_addr: ["teleport.app.suncoast.systems:443"]

    kubernetes_service:
      enabled: true
      # make it explicitly reachable from the local proxy in this same process
      listen_addr: 127.0.0.1:3026
      kube_cluster_name: local

    ssh_service:
      enabled: false
---
# ============================
# Teleport Deployment
# ============================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teleport
  namespace: teleport
  labels:
    app: teleport
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teleport
  template:
    metadata:
      labels:
        app: teleport
    spec:
      serviceAccountName: teleport-sa
      initContainers:
        - name: wait-for-etcd
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              host="etcd-0.etcd.teleport.svc.cluster.local"
              echo "Waiting for DNS: $host"
              until nslookup "$host" >/dev/null 2>&1; do sleep 2; done
              echo "Waiting for TCP 2379 on $host"
              until nc -z "$host" 2379 >/dev/null 2>&1; do sleep 2; done
              echo "etcd is up"
      volumes:
        - name: teleport-config
          configMap:
            name: teleport-config
        - name: teleport-data
          emptyDir: {}
        - name: etcd-ca
          secret:
            secretName: etcd-tls
        - name: teleport-bootstrap
          configMap:
            name: teleport-bootstrap
      containers:
        - name: teleport
          image: public.ecr.aws/gravitational/teleport-distroless:18.1.4
          imagePullPolicy: IfNotPresent
          command:
            - teleport
            - start
            - -c
            - /etc/teleport/teleport.yaml
            - --bootstrap=/bootstrap/github.yaml
          ports:
            - name: auth
              containerPort: 3025
            - name: web
              containerPort: 3080
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: teleport-config
              mountPath: /etc/teleport
              readOnly: true
            - name: teleport-data
              mountPath: /var/lib/teleport
            - name: etcd-ca
              mountPath: /etc/etcd-ca
              readOnly: true
            - name: teleport-bootstrap
              mountPath: /bootstrap
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 3080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3080
            initialDelaySeconds: 20
            periodSeconds: 10
---
# ============================
# Teleport Service (ClusterIP)
# ============================
apiVersion: v1
kind: Service
metadata:
  name: teleport
  namespace: teleport
spec:
  selector:
    app: teleport
  ports:
    - name: web
      port: 3080
      targetPort: 3080
    - name: auth
      port: 3025
      targetPort: 3025
    - name: ssh
      port: 3023
      targetPort: 3023
  type: LoadBalancer
  loadBalancerIP: 10.0.0.121
---
# ============================
# APISIX route → Teleport over HTTPS
# ============================
apiVersion: apisix.apache.org/v2
kind: ApisixUpstream
metadata:
  name: teleport            # <-- must match Service name
  namespace: teleport       # <-- and namespace
spec:
  scheme: https             # talk HTTPS to upstream
  passHost: pass            # forward original Host header
  # You can leave the rest empty; the controller will fill service endpoints
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: teleport-route
  namespace: teleport
  annotations:
    apisix.apache.org/timeout: "900"
    apisix.apache.org/websocket: "true"
    apisix.apache.org/enable-cors: "true"
spec:
  ingressClassName: apisix
  http:
    - name: teleport
      websocket: true
      match:
        hosts:
          - teleport.app.suncoast.systems
          - k8s.app.suncoast.systems
          - gateway-manager.app.suncoast.systems
          - harbor.app.suncoast.systems
          - harbor-dex.app.suncoast.systems
          - vault.app.suncoast.systems
          - vault-dex.app.suncoast.systems
          - argocd.app.suncoast.systems
          - argocd-dex.app.suncoast.systems
          - policy-reporter.app.suncoast.systems
          - linkerd.app.suncoast.systems
          - jaeger.app.suncoast.systems
          - pgweb.app.suncoast.systems
          - yugabyte.app.suncoast.systems
          - pfsense.app.suncoast.systems
          - proxmox.app.suncoast.systems
          - ai.app.suncoast.systems
        paths: ["/*"]
      backends:
        - serviceName: teleport
          servicePort: 3080
      plugins:
        - name: client-control
          enable: true
          config:
            ssl_verify: false
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri: ["^/pgweb(/.*)?$", "/$1"]
    # - name: direct-linkerd
    #   websocket: true
    #   match:
    #     hosts:
    #       - linkerd.app.suncoast.systems
    #     paths:
    #       - "/api/*"
    #   backends:
    #     - serviceName: linkerd-web-proxy
    #       servicePort: 80
    #   plugins:
    #     - name: proxy-rewrite
    #       enable: true
    #       config:
    #         host: web.linkerd-viz.svc.cluster.local
    #         headers:
    #             set: '{"Origin": "http://localhost"}'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: teleport-bootstrap
  namespace: teleport
data:
  github.yaml: |
    ---
    kind: cluster_auth_preference
    version: v2
    metadata:
      name: cluster-auth-preference
    spec:
      type: github
      connector_name: new_github_connector
      second_factor: otp

    ---
    kind: role
    version: v7
    metadata:
      name: admin
    spec:
      options:
        max_session_ttl: 8h0m0s
      allow:
        node_labels: {"*":"*"}
        db_labels: {"*":"*"}
        app_labels: {"*":"*"}
        kubernetes_labels: {"*":"*"}
        windows_desktop_labels: {"*":"*"}
        logins: ["root","ubuntu"]
        rules:
          - resources: ["*"]
            verbs: ["*"]
        kubernetes_groups: ["system:masters"]

    ---
    kind: github
    version: v3
    metadata:
      name: new_github_connector
    spec:
      client_id: "<path:secret/data/k8s-teleport-teleport-client-id#value>"
      client_secret: "<path:secret/data/k8s-teleport-teleport-secret#value>"
      redirect_url: "https://teleport.app.suncoast.systems/v1/webapi/github/callback"
      display: "GitHub"
      teams_to_roles:
        - organization: "<path:secret/data/k8s-teleport-teleport-github-org#value>"
          team: "<path:secret/data/k8s-teleport-teleport-github-admin-team#value>"
          roles: ["admin"]
        - organization: "<path:secret/data/k8s-teleport-teleport-github-org#value>"
          team: "<path:secret/data/k8s-teleport-teleport-github-user-team#value>"
          roles: ["access"]
