---
# ============================
# Namespace (Linkerd off)
# ============================
apiVersion: v1
kind: Namespace
metadata:
  name: teleport
  labels:
    app: teleport
  annotations:
    linkerd.io/inject: disabled
    field.cattle.io/projectId: local:infrastructure
    scheduler.alpha.kubernetes.io/node-selector: "dedicated=srvr-node"
    argocd.argoproj.io/sync-wave: "-5"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: etcd-tls-bootstrap
  namespace: teleport
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-writer
  namespace: teleport
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get","create","update","patch","delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-writer-binding
  namespace: teleport
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
subjects:
- kind: ServiceAccount
  name: etcd-tls-bootstrap
  namespace: teleport
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-writer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: teleport-sa
  namespace: teleport
---
# Impersonation for K8s access via Teleport
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: teleport-kube-impersonator
rules:
- apiGroups: [""]
  resources: ["users","groups","serviceaccounts"]
  verbs: ["impersonate"]
- apiGroups: ["authentication.k8s.io"]
  resources: ["userextras/*"]
  verbs: ["impersonate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: teleport-kube-impersonator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: teleport-kube-impersonator
subjects:
- kind: ServiceAccount
  name: teleport-sa
  namespace: teleport
---
# Service discovery for auto-registration of annotated services
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: teleport-service-discovery
rules:
- apiGroups: [""]
  resources: ["services", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: teleport-service-discovery-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: teleport-service-discovery
subjects:
- kind: ServiceAccount
  name: teleport-sa
  namespace: teleport
---
# ============================
# Watchdog RBAC (allow pod self-delete for auto-restart)
# ============================
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: teleport-self-kill
  namespace: teleport
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get","delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: teleport-self-kill-binding
  namespace: teleport
subjects:
- kind: ServiceAccount
  name: teleport-sa
  namespace: teleport
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: teleport-self-kill
---
# ============================
# PreSync: generate etcd TLS (CA + server cert)
# ============================
apiVersion: batch/v1
kind: Job
metadata:
  name: etcd-tls-bootstrap
  namespace: teleport
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      serviceAccountName: etcd-tls-bootstrap
      restartPolicy: OnFailure
      volumes:
        - name: work
          emptyDir: {}
      containers:
        - name: openssl
          image: alpine:3.19
          volumeMounts:
            - name: work
              mountPath: /work
          command: ["/bin/sh","-c"]
          args:
            - |
              apk add --no-cache openssl

              # ----- CA extensions (real CA) -----
              cat >/work/ca.cnf <<'CNF'
              [v3_ca]
              basicConstraints = critical, CA:true
              keyUsage = critical, keyCertSign, cRLSign
              subjectKeyIdentifier = hash
              authorityKeyIdentifier = keyid:always,issuer
              CNF

              # ----- Server/Peer cert needs BOTH serverAuth + clientAuth -----
              cat >/work/server.cnf <<'CNF'
              [v3_server_peer]
              basicConstraints = CA:FALSE
              keyUsage = critical, digitalSignature, keyEncipherment
              extendedKeyUsage = serverAuth, clientAuth
              subjectAltName = @alt_names
              [alt_names]
              DNS.1 = etcd-0.etcd.teleport.svc.cluster.local
              DNS.2 = etcd.teleport.svc
              DNS.3 = etcd.teleport.svc.cluster.local
              DNS.4 = localhost
              IP.1  = 127.0.0.1
              CNF

              # ----- Client cert (Teleport) needs clientAuth -----
              cat >/work/client.cnf <<'CNF'
              [v3_client]
              basicConstraints = CA:FALSE
              keyUsage = critical, digitalSignature, keyEncipherment
              extendedKeyUsage = clientAuth
              CNF

              # Generate CA
              openssl genrsa -out /work/ca.key 4096
              openssl req -new -x509 -key /work/ca.key -sha256 -days 3650 \
                -subj "/CN=etcd-ca" \
                -extensions v3_ca -config /work/ca.cnf \
                -out /work/ca.crt

              # Generate server/peer key + CSR
              openssl genrsa -out /work/server.key 2048
              openssl req -new -key /work/server.key \
                -subj "/CN=etcd-0.etcd.teleport.svc.cluster.local" \
                -out /work/server.csr
              # Sign server with BOTH EKUs
              openssl x509 -req -in /work/server.csr -CA /work/ca.crt -CAkey /work/ca.key \
                -CAcreateserial -out /work/server.crt -days 3650 -sha256 \
                -extensions v3_server_peer -extfile /work/server.cnf

              # Generate Teleport client key + CSR
              openssl genrsa -out /work/client.key 2048
              openssl req -new -key /work/client.key \
                -subj "/CN=teleport" \
                -out /work/client.csr
              # Sign client with clientAuth EKU
              openssl x509 -req -in /work/client.csr -CA /work/ca.crt -CAkey /work/ca.key \
                -CAcreateserial -out /work/client.crt -days 3650 -sha256 \
                -extensions v3_client -extfile /work/client.cnf

              chmod 0644 /work/ca.crt /work/server.crt /work/client.crt
              chmod 0640 /work/server.key /work/client.key
              touch /work/ready
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
        - name: kubectl
          image: alpine:3.19
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: work
              mountPath: /work
          command: ["/bin/sh","-c"]
          args:
            - |
              apk add --no-cache kubectl
              while [ ! -f /work/ready ]; do sleep 1; done
              kubectl -n teleport create secret generic etcd-tls \
                --from-file=ca.crt=/work/ca.crt \
                --from-file=server.crt=/work/server.crt \
                --from-file=server.key=/work/server.key \
                --from-file=client.crt=/work/client.crt \
                --from-file=client.key=/work/client.key \
                --dry-run=client -o yaml | kubectl apply -f -
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
# ============================
# etcd headless Service
# ============================
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: teleport
  labels:
    app: etcd
spec:
  clusterIP: None
  selector:
    app: etcd
  ports:
    - name: client
      port: 2379
      targetPort: 2379
    - name: peer
      port: 2380
      targetPort: 2380
---
# ============================
# etcd StatefulSet (single node, TLS)
# ============================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: teleport
spec:
  serviceName: etcd
  replicas: 1
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      volumes:
        - name: etcd-tls
          secret:
            secretName: etcd-tls
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.14
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/etcd"]
          args:
            - --name=$(POD_NAME)
            - --data-dir=/etcd-data
            # Client TLS
            - --listen-client-urls=https://0.0.0.0:2379
            - --advertise-client-urls=https://$(POD_NAME).etcd.teleport.svc.cluster.local:2379
            - --trusted-ca-file=/etc/etcd/pki/ca.crt
            - --cert-file=/etc/etcd/pki/server.crt
            - --key-file=/etc/etcd/pki/server.key
            # Peer TLS
            - --listen-peer-urls=https://0.0.0.0:2380
            - --initial-advertise-peer-urls=https://$(POD_NAME).etcd.teleport.svc.cluster.local:2380
            - --peer-trusted-ca-file=/etc/etcd/pki/ca.crt
            - --peer-cert-file=/etc/etcd/pki/server.crt
            - --peer-key-file=/etc/etcd/pki/server.key
            - --initial-cluster=etcd-0=https://etcd-0.etcd.teleport.svc.cluster.local:2380
            - --initial-cluster-state=new
            - --initial-cluster-token=etcd-cluster-1
            - --logger=zap
            - --log-level=info
            - --client-cert-auth=false
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 2379
              name: client
            - containerPort: 2380
              name: peer
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            tcpSocket: { port: 2379 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 2379 }
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: etcd-data
              mountPath: /etcd-data
            - name: etcd-tls
              mountPath: /etc/etcd/pki
              readOnly: true
  volumeClaimTemplates:
    - metadata:
        name: etcd-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
# ============================
# Legacy iDRAC TLS bridge (Nginx)
# Allows Teleport to talk HTTP in-cluster while Nginx speaks TLS1.0 to iDRAC and rewrites absolute URLs
# ============================
apiVersion: v1
kind: ConfigMap
metadata:
  name: idrac-bridge-haproxy
  namespace: teleport
data:
  nginx.conf: |
    worker_processes  auto;
    events { worker_connections  4096; }
    http {
      log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
      access_log /dev/stdout main;
      error_log  /dev/stderr notice;

      upstream idrac_upstream {
        server 10.0.2.10:443;
        keepalive 16;
      }

      server {
        listen 8080;

        # Talk to legacy iDRAC over TLS1.0 and ignore its cert.
        resolver 1.1.1.1 valid=300s ipv6=off;

        location / {
          proxy_pass https://idrac_upstream;
          proxy_ssl_server_name off;
          proxy_ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
          proxy_ssl_ciphers ALL:@SECLEVEL=0;
          proxy_ssl_verify off;
          proxy_ssl_session_reuse on;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_set_header Host 10.0.2.10;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

          # Rewrite absolute redirects/cookie domains to stay on Teleport.
          proxy_redirect https://10.0.2.10/ https://idrac.teleport.app.suncoast.systems/;
          proxy_cookie_domain 10.0.2.10 idrac.teleport.app.suncoast.systems;

          # Rewrite absolute URLs in HTML/CSS/JS responses.
          sub_filter_once off;
          sub_filter_types text/html text/css application/javascript application/json text/xml;
          sub_filter "https://10.0.2.10" "https://idrac.teleport.app.suncoast.systems";
          sub_filter "http://10.0.2.10" "https://idrac.teleport.app.suncoast.systems";
          proxy_set_header Accept-Encoding "";

          proxy_buffering on;
          proxy_buffers 32 64k;
          proxy_busy_buffers_size 256k;
          proxy_max_temp_file_size 0;

          proxy_connect_timeout 30s;
          proxy_read_timeout 300s;
          proxy_send_timeout 300s;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idrac-bridge
  namespace: teleport
  labels:
    app: idrac-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: idrac-bridge
  template:
    metadata:
      labels:
        app: idrac-bridge
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          args: ["nginx","-g","daemon off;","-c","/etc/nginx/nginx.conf"]
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
        - name: diag
          image: curlimages/curl:8.6.0
          command: ["sleep","infinity"]
      volumes:
        - name: config
          configMap:
            name: idrac-bridge-haproxy
---
apiVersion: v1
kind: Service
metadata:
  name: idrac-bridge
  namespace: teleport
spec:
  selector:
    app: idrac-bridge
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# ============================
# Teleport config (ConfigMap)
# ============================
apiVersion: v1
kind: ConfigMap
metadata:
  name: teleport-config
  namespace: teleport
data:
  teleport.yaml: |
    version: v3
    teleport:
      data_dir: /var/lib/teleport
      log:
        output: stderr
        severity: INFO
      storage:
        type: etcd
        peers:
          - https://etcd-0.etcd.teleport.svc.cluster.local:2379
        prefix: /teleport/
        tls_ca_file:   /etc/etcd-ca/ca.crt
        tls_cert_file: /etc/etcd-ca/client.crt
        tls_key_file:  /etc/etcd-ca/client.key

    app_service:
      enabled: true
      apps:
        - name: k8s-mgmt-console
          uri: https://rancher.cattle-system.svc.cluster.local
          public_addr: k8s.teleport.app.suncoast.systems
          insecure_skip_verify: true
          rewrite:
            headers:
              - "Host: k8s.teleport.app.suncoast.systems"
              - "Origin: https://k8s.teleport.app.suncoast.systems"

        - name: harbor-console
          uri: https://10.0.0.10
          public_addr: harbor.teleport.app.suncoast.systems
          insecure_skip_verify: true
          rewrite:
            headers:
              - "Host: harbor.teleport.app.suncoast.systems"

        - name: harbor-dex
          uri: https://10.0.0.10
          public_addr: harbor-dex.teleport.app.suncoast.systems
          insecure_skip_verify: true
          rewrite:
            headers:
              - "Host: harbor-dex.teleport.app.suncoast.systems"

        - name: pfsense
          uri: https://10.0.0.10
          public_addr: pfsense.teleport.app.suncoast.systems
          insecure_skip_verify: true
          rewrite:
            headers:
              - "Host: pfsense.suncoast.systems"

        - name: proxmox
          uri: https://10.0.0.10
          public_addr: proxmox.teleport.app.suncoast.systems
          insecure_skip_verify: true
          rewrite:
            headers:
              - "Host: proxmox.suncoast.systems"

        - name: idrac
          uri: http://idrac-bridge.teleport.svc.cluster.local:8080
          public_addr: idrac.teleport.app.suncoast.systems
          rewrite:
            headers:
              - "Host: 10.0.2.10"

      resources:
        - labels:
            "teleport.dev/kubernetes-cluster": "main-cluster"
            "teleport.dev/origin": "discovery-kubernetes"

    auth_service:
      enabled: true
      listen_addr: 0.0.0.0:3025
      proxy_protocol: off
      cluster_name: suncoast-teleport
      proxy_listener_mode: multiplex
      authentication:
        type: github
        connector_name: new_github_connector
        local_auth: false
        second_factor: otp

    proxy_service:
      enabled: true
      web_listen_addr: 0.0.0.0:3080
      public_addr: ["teleport.app.suncoast.systems:443"]
      proxy_protocol: off

    kubernetes_service:
      enabled: true
      listen_addr: 127.0.0.1:3026
      kube_cluster_name: local

    discovery_service:
      enabled: true
      discovery_group: main-cluster
      # Configure discovery polling intervals
      poll_interval: 30s        # How often to do full reconciliation scans
      kubernetes:
        - types: ["app"]
          namespaces: ["*"]
          # Only discover services with Teleport annotations
          labels:
            "teleport.dev/enroll": "true"

    ssh_service:
      enabled: false
---
# ============================
# Teleport Deployment (+ watchdog sidecar)
# ============================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teleport
  namespace: teleport
  labels:
    app: teleport
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teleport
  template:
    metadata:
      labels:
        app: teleport
    spec:
      serviceAccountName: teleport-sa
      initContainers:
        - name: wait-for-etcd
          image: busybox:1.36
          command: ["/bin/sh","-c"]
          args:
            - |
              host="etcd-0.etcd.teleport.svc.cluster.local"
              echo "Waiting for DNS: $host"
              until nslookup "$host" >/dev/null 2>&1; do sleep 2; done
              echo "Waiting for TCP 2379 on $host"
              until nc -z "$host" 2379 >/dev/null 2>&1; do sleep 2; done
              echo "etcd is up"
      volumes:
        - name: teleport-config
          configMap:
            name: teleport-config
        - name: teleport-data
          emptyDir: {}
        - name: etcd-ca
          secret:
            secretName: etcd-tls
        - name: teleport-bootstrap
          configMap:
            name: teleport-bootstrap
      containers:
        - name: teleport
          image: public.ecr.aws/gravitational/teleport-distroless:18.1.4
          imagePullPolicy: IfNotPresent
          command: ["teleport","start","-c","/etc/teleport/teleport.yaml","--bootstrap=/bootstrap/initial_config.yaml","--apply-on-startup=/bootstrap/additional.yaml"]
          ports:
            - { name: auth, containerPort: 3025 }
            - { name: web,  containerPort: 3080 }
          resources:
            requests: { cpu: "100m", memory: "512Mi" }
            limits:   { cpu: "1000m", memory: "1Gi" }
          volumeMounts:
            - { name: teleport-config,   mountPath: /etc/teleport,    readOnly: true }
            - { name: teleport-data,     mountPath: /var/lib/teleport }
            - { name: etcd-ca,           mountPath: /etc/etcd-ca,     readOnly: true }
            - { name: teleport-bootstrap,mountPath: /bootstrap,        readOnly: true }
          readinessProbe:
            tcpSocket: { port: 3080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 3080 }
            initialDelaySeconds: 20
            periodSeconds: 10

        # Watchdog: restart pod if /webapi/connectionupgrade doesn't return 101
        - name: teleport-guard
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eu
              apk add --no-cache curl jq openssl >/dev/null

              HOST="${HOST:-teleport.app.suncoast.systems}"
              BASE_URL="https://${HOST}"
              PING_PATH="${PING_PATH:-/webapi/ping}"
              WS_PATH="${WS_PATH:-/webapi/connectionupgrade}"

              FAILS=0
              THRESH="${THRESH:-3}"
              SLEEP="${SLEEP:-30}"
              ENABLE_ALPN="${ENABLE_ALPN:-0}"   # set "1" only if Teleport ALPN mux is really on :443
              VERBOSE="${VERBOSE:-0}"
              PIN_DNS="${PIN_DNS:-0}"           # set "1" to pin DNS each loop via curl --resolve
              BYPASS_PING="${BYPASS_PING:-0}"   # set "1" to skip /webapi/ping entirely

              api() {
                curl -fsS --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                  -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" "$@"
              }

              # Common curl flags: HTTP/1.1, short timeout, quiet but strict on failures.
              CURL_COMMON="--http1.1 --max-time 4 -sS"

              # Pin DNS per loop to avoid transient resolver blips.
              pin_resolve_args() {
                [ "$PIN_DNS" = "1" ] || return 0
                ip="$(getent hosts "$HOST" | awk '{print $1}' | head -1 || true)"
                [ -n "$ip" ] && printf -- "--resolve %s:443:%s" "$HOST" "$ip"
              }

              # ----- Checks -------------------------------------------------------
              check_ping_http_jsonish() {
                [ "$BYPASS_PING" = "1" ] && return 0
                local code ctype body
                code="$(curl $CURL_COMMON $(pin_resolve_args) -o /tmp/ping.out -D - -w '%{http_code}' \
                        "${BASE_URL}${PING_PATH}" || true)"
                ctype="$(sed -n 's/^[Cc]ontent-[Tt]ype:[[:space:]]*\(.*\)$/\1/p' /tmp/ping.out | head -1 || true)"
                body="$(sed '1,/^\r\?$/d' /tmp/ping.out || true)"

                [ "${VERBOSE}" = "1" ] && { echo "ping code=${code} ctype=${ctype}"; echo "ping body(head):"; echo "$body" | head -2; }

                # Accept 200 with JSON (by parse or content-type) OR common 3xx auth redirects.
                if [ "$code" = "200" ]; then
                  printf '%s' "$body" | jq -e . >/dev/null 2>&1 && return 0
                  case "$ctype" in *application/json*|*+json*) return 0 ;; esac
                fi
                case "$code" in 301|302|303|307|308) return 0 ;; esac
                return 1
              }

              check_ws_upgrade() {
                local hdrs
                hdrs="$(curl $CURL_COMMON --no-alpn $(pin_resolve_args) -o /dev/null -D - \
                  -H 'Connection: Upgrade' \
                  -H 'Upgrade: websocket' \
                  -H 'Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==' \
                  -H 'Sec-WebSocket-Version: 13' \
                  -H 'X-Teleport-Upgrade: websocket' \
                  -w 'HTTP/%{http_version} %{http_code}\n' \
                  "${BASE_URL}${WS_PATH}" || true)"
                [ "${VERBOSE}" = "1" ] && echo "ws hdrs:" && echo "$hdrs" | head -5
                echo "$hdrs" | awk 'BEGIN{ok=0} /HTTP\/1\.[01] 101/{ok=1} END{exit !ok}' || return 1
                echo "$hdrs" | awk 'BEGIN{ok=0} tolower($0) ~ /^upgrade:\s*websocket/{ok=1} END{exit !ok}' || return 1
              }

              check_alpn_mux() {
                [ "$ENABLE_ALPN" = "1" ] || return 0  # treat as OK when disabled
                openssl s_client -connect "${HOST}:443" -servername "${HOST}" -alpn teleport-ssh -brief </dev/null 2>/dev/null \
                  | awk 'BEGIN{ok=0} /ALPN protocol:\s*teleport-ssh/{ok=1} END{exit !ok}'
              }

              # ----- Main loop ----------------------------------------------------
              while :; do
                ok_any=0
                pass=""

                if check_ws_upgrade; then ok_any=1; pass="${pass} WS"; else echo "teleport-guard: websocket upgrade check failed."; fi
                if check_ping_http_jsonish; then ok_any=1; pass="${pass} PING"; else echo "teleport-guard: ping not JSON/200 (proxy may be redirecting/login)."; fi
                if check_alpn_mux; then ok_any=1; pass="${pass} ALPN"; else [ "$ENABLE_ALPN" = "1" ] && echo "teleport-guard: ALPN mux (teleport-ssh) not negotiated."; fi

                if [ "$ok_any" -eq 1 ]; then
                  [ -n "$pass" ] && echo "teleport-guard: PASS:${pass}"
                  FAILS=0
                else
                  FAILS=$((FAILS+1))
                  echo "teleport-guard: fail ${FAILS}/${THRESH}"
                fi

                if [ "$FAILS" -ge "$THRESH" ]; then
                  echo "teleport-guard: restarting pod ${POD_NAME} (composite health failing)"
                  api -X DELETE "https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}/api/v1/namespaces/${POD_NAMESPACE}/pods/${POD_NAME}" || true
                  sleep 300
                  FAILS=0
                fi

                sleep "$SLEEP"
              done
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: HOST
              value: "teleport.app.suncoast.systems"
            # Tuning knobs (safe defaults)
            - name: THRESH
              value: "3"
            - name: SLEEP
              value: "30"
            - name: ENABLE_ALPN     # keep "0" unless Teleport listens on :443 with ALPN mux
              value: "0"
            - name: VERBOSE
              value: "0"
            - name: PIN_DNS         # recommended "1" to smooth transient DNS misses
              value: "1"
            - name: BYPASS_PING     # set "1" if your proxy always mangles /webapi/ping
              value: "0"
          resources:
            requests: { cpu: "200m", memory: "32Mi" }
            limits:   { cpu: "1000m", memory: "64Mi" }
---
# ============================
# Teleport Service (LB for APISIX)
# ============================
apiVersion: v1
kind: Service
metadata:
  name: teleport
  namespace: teleport
spec:
  selector:
    app: teleport
  ports:
    - name: web
      port: 3080
      targetPort: 3080
    - name: auth
      port: 3025
      targetPort: 3025
    - name: ssh
      port: 3023
      targetPort: 3023
  type: LoadBalancer
  loadBalancerIP: 10.0.0.121
---
# ============================
# APISIX route → Teleport over HTTPS
# ============================
apiVersion: apisix.apache.org/v2
kind: ApisixUpstream
metadata:
  name: teleport
  namespace: teleport
spec:
  scheme: https
  passHost: pass
  timeout:
    connect: 10s
    send: 3600s
    read: 3600s
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: teleport-route
  namespace: teleport
  annotations:
    apisix.apache.org/timeout: "900"
    apisix.apache.org/websocket: "true"
    apisix.apache.org/enable-cors: "true"
spec:
  ingressClassName: apisix
  http:
    - name: teleport
      websocket: true
      match:
        hosts:
          - "*.teleport.app.suncoast.systems"
          - "teleport.app.suncoast.systems"
        paths: ["/*"]
      backends:
        - serviceName: teleport
          servicePort: 3080
      plugins:
        - name: client-control
          enable: true
          config:
            ssl_verify: false
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri: ["^/pgweb(/.*)?$", "/$1"]

---
# ============================
# Teleport bootstrap resources
# ============================
apiVersion: v1
kind: ConfigMap
metadata:
  name: teleport-bootstrap
  namespace: teleport
data:
  initial_config.yaml: |
    ---
    kind: cluster_auth_preference
    version: v2
    metadata:
      name: cluster-auth-preference
    spec:
      type: github
      connector_name: new_github_connector
      second_factor: otp

    ---
    kind: role
    version: v7
    metadata:
      name: admin
    spec:
      options:
        max_session_ttl: 8h0m0s
      allow:
        node_labels: {"*":"*"}
        db_labels: {"*":"*"}
        app_labels: {"*":"*"}
        kubernetes_labels: {"*":"*"}
        windows_desktop_labels: {"*":"*"}
        logins: ["root","ubuntu"]
        rules:
          - resources: ["*"]
            verbs: ["*"]
        kubernetes_groups: ["system:masters"]

    ---
    kind: github
    version: v3
    metadata:
      name: new_github_connector
    spec:
      client_id: "<path:secret/data/k8s-teleport-teleport-client-id#value>"
      client_secret: "<path:secret/data/k8s-teleport-teleport-secret#value>"
      redirect_url: "https://teleport.app.suncoast.systems/v1/webapi/github/callback"
      display: "GitHub"
      teams_to_roles:
        - organization: "<path:secret/data/k8s-teleport-teleport-github-org#value>"
          team: "<path:secret/data/k8s-teleport-teleport-github-admin-team#value>"
          roles: ["admin"]
        - organization: "<path:secret/data/k8s-teleport-teleport-github-org#value>"
          team: "<path:secret/data/k8s-teleport-teleport-github-user-team#value>"
          roles: ["access"]
  additional.yaml: |
    ---
    kind: role
    version: v7
    metadata: { name: vault-app-bot }
    spec:
      allow:
        app_labels:
          app: vault
    ---
    kind: bot
    version: v1
    metadata: { name: vault-bot }
    spec: { roles: [vault-app-bot] }
    ---
    kind: token
    version: v2
    metadata: { name: vault-bot-gcp }
    spec:
      roles: [Bot]
      bot_name: vault-bot
      join_method: gcp
      gcp:
        allow:
        - project_ids: ["<path:secret/data/k8s-teleport-vault-project-id#value>"]
          service_accounts: ["<path:secret/data/k8s-teleport-vault-service-account#value>"]
